<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Book</title>
<style>
:root{--cream:#f6efe4;--navy:#1c2340;--coral:#e07a5f;--green:#2a9d8f;--gold:#f3c969;--white:#fffdf9;--shadow:0 14px 34px rgba(28,35,64,.12);--radius:24px;font-size:16px}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--cream);color:var(--navy);font-family:ui-rounded,"Avenir Next",Nunito,system-ui,sans-serif}body{overflow-x:hidden}.app{width:min(100%,940px);margin:0 auto;padding:18px 16px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:-.04em;font-size:1.15rem}.controls{display:flex;gap:8px}.icon-btn,.small-btn{border:2px solid var(--navy);background:var(--white);color:var(--navy);border-radius:999px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--navy)}.icon-btn{font-size:1rem;min-width:42px}.icon-btn:active,.small-btn:active,.btn:active{transform:translateY(2px);box-shadow:none}.screen{animation:in .35s ease}.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{min-height:calc(100vh - 98px);display:grid;place-items:center;text-align:center}.hero-card{width:min(100%,650px);padding:clamp(25px,7vw,62px) clamp(20px,7vw,70px);background:var(--white);border-radius:34px;box-shadow:var(--shadow);border:3px solid var(--navy)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(3.4rem,13vw,7rem);line-height:.88;letter-spacing:-.08em;margin-bottom:18px}h2{font-size:clamp(2rem,7vw,3.7rem);line-height:.95;letter-spacing:-.06em;margin-bottom:12px}h3{font-size:1.25rem}.hero p{font-size:1.2rem;max-width:480px;margin:0 auto 28px}.avatar{width:104px;height:104px;object-fit:cover;border-radius:50%;border:4px solid var(--navy);box-shadow:6px 6px 0 var(--coral);margin-bottom:20px}.avatar.end{box-shadow:6px 6px 0 var(--green)}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.btn{border:0;border-radius:999px;padding:14px 22px;background:var(--coral);color:#fff;font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #b95542}.btn.green{background:var(--green);box-shadow:0 5px 0 #1d756b}.btn.navy{background:var(--navy);box-shadow:0 5px 0 #0c1025}.btn.light{background:var(--white);color:var(--navy);border:2px solid var(--navy);box-shadow:0 4px 0 var(--navy)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:900;color:var(--coral);margin-bottom:8px}.round-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:12px 0 22px}.round-head h2{margin:0}.progress{font-weight:900;background:var(--gold);padding:8px 12px;border-radius:999px;white-space:nowrap}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.line-card{background:var(--white);border-radius:var(--radius);padding:21px 18px;min-height:92px;display:flex;align-items:center;font-weight:800;font-size:1.14rem;box-shadow:var(--shadow);border:2px solid transparent}.line-card:nth-child(3n){border-color:var(--green)}.line-card:nth-child(2n){border-color:#f0bf54}.footer-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.model-card{max-width:730px;margin:0 auto;background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.model-list{display:grid;gap:9px}.model-line{padding:12px 14px;background:#fff8ed;border-radius:15px;border-left:5px solid var(--green)}.model-line strong{display:block;font-size:1.08rem}.model-line span{display:block;color:#5e6276;font-size:.93rem;margin-top:3px}.tip{position:relative;cursor:help;border-bottom:2px dotted var(--coral)}.tip:focus::after,.tip:hover::after,.tip.show::after{content:attr(data-gloss);position:absolute;left:50%;bottom:calc(100% + 7px);z-index:3;transform:translateX(-50%);background:var(--navy);color:#fff;padding:6px 9px;border-radius:8px;white-space:nowrap;font-size:.78rem;font-weight:700;box-shadow:var(--shadow)}.italian-lines{display:grid;gap:12px}.italian-line{position:relative;background:var(--white);border-radius:19px;padding:17px 15px;font-size:1.25rem;font-weight:850;box-shadow:var(--shadow);line-height:1.5}.italian-line .tip{display:inline-block}.instructions{background:#dff1e9;border-radius:18px;padding:13px 15px;margin-bottom:16px;font-weight:750}.blank-list{display:grid;gap:17px}.blank-row{background:var(--white);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.sentence{font-size:1.25rem;font-weight:850;min-height:34px}.dropzone{display:inline-flex;min-width:90px;min-height:34px;padding:0 8px;border-bottom:3px dashed var(--coral);vertical-align:bottom;color:var(--coral);justify-content:center}.dropzone.filled{background:#fff0e8;border-radius:8px;border-bottom-style:solid}.dropzone.correct{background:#dff1e9;border-color:var(--green);color:var(--navy)}.bank{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.word{border:2px solid var(--navy);background:#fff8ed;border-radius:999px;padding:8px 13px;font:inherit;font-weight:800;cursor:grab;touch-action:none}.word.used{opacity:.38}.feedback{font-weight:850;color:var(--coral);min-height:22px;margin-top:9px}.city-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.city-card{background:var(--white);border-radius:22px;padding:15px 12px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.city-card h3{margin:0;font-size:1.25rem}.city-card .english{color:#63687c;font-size:.9rem}.city-card .btn{font-size:.9rem;padding:10px 12px;margin-top:auto}.fact{grid-column:1/-1;background:#fff8ed;border-radius:16px;padding:14px;text-align:left;font-weight:750}.fact em{display:block;color:#64697a;font-style:normal;font-weight:600;margin-top:5px}.book-shell{max-width:720px;margin:0 auto}.page-nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:17px}.page-title{font-weight:900;font-size:1.15rem;text-align:center}.book-page{background:var(--white);min-height:420px;border-radius:28px;border:5px solid var(--coral);padding:clamp(20px,5vw,45px);box-shadow:var(--shadow);position:relative}.book-page:before{content:"";position:absolute;inset:10px;border:2px dashed #f1c0ad;border-radius:19px;pointer-events:none}.page-content{position:relative;z-index:1}.page-content h2{font-size:clamp(2rem,7vw,3.3rem)}.chip-bank{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0}.chip{background:#dff1e9;border:2px solid var(--green);color:var(--navy);border-radius:999px;padding:9px 12px;font:inherit;font-weight:800;cursor:grab;touch-action:none}.chip.dragging,.word.dragging{opacity:.55}.placed{display:grid;gap:9px;min-height:115px;padding:12px;border:2px dashed var(--green);border-radius:17px;background:#f4fbf6}.placed:empty:after{content:'Drag 2 or more sentences here';color:#66877e;font-weight:750;align-self:center;text-align:center}.placed-chip{background:#fff8ed;border-radius:13px;padding:10px 12px;font-weight:800;cursor:pointer;border:1px solid #ead7bd}.page-note{text-align:center;color:#64697a;font-size:.9rem;margin-top:10px}.book-cover{display:grid;place-items:center;text-align:center;min-height:340px;background:#ffe4d6}.book-cover h2{font-size:clamp(2.5rem,10vw,5rem)}.finished{max-width:720px;margin:auto}.final-book{display:grid;gap:12px}.final-page{background:var(--white);border-radius:20px;padding:17px;box-shadow:var(--shadow);border-left:7px solid var(--green)}.final-page h3{margin:0 0 10px}.final-page p{margin:6px 0;font-weight:750}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 17px;border-radius:999px;font-weight:800;z-index:10;box-shadow:var(--shadow)}@media(max-width:700px){.city-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.city-card:last-child{grid-column:1/-1}.card-grid{grid-template-columns:1fr}.line-card{min-height:70px}.round-head{align-items:start;flex-direction:column}.page-nav .btn{padding:10px 13px;font-size:.9rem}}@media(max-width:390px){.app{padding-left:11px;padding-right:11px}.city-grid{gap:8px}.city-card{padding:12px 8px}.topbar{margin-bottom:12px}.hero-card{padding-left:15px;padding-right:15px}.btn{padding-left:17px;padding-right:17px}}
body.projector{font-size:19px}.projector .app{max-width:1100px}.projector .line-card,.projector .italian-line{font-size:1.3rem}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">✦ Aura Book</div><div class="controls"><button class="icon-btn" id="muteBtn" aria-label="Mute sounds">🔊</button><button class="icon-btn" id="projectorBtn" aria-label="Projector text size">⛶</button></div></header>
<main id="app"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const app=document.getElementById('app'), toast=document.getElementById('toast');
let sound=true, projector=false, city=null, round=0, page=0, placed=[], bookPlaced=Array.from({length:10},()=>[]), quizIndex=0, quizSolved=[], quizAttempts=0;
const gloss={sono:'am',città:'city',italiana:'Italian',famosa:'famous',abito:'I live',in:'in',nel:'in the',sud:'south',"d'Italia":'of Italy',vicina:'near',al:'to the',mare:'sea',ho:'I have',una:'a',piazza:'square',vedo:'I see',il:'the',amo:'I love',la:'the',mia:'my',storia:'history',A:'see',presto:'you soon'};
function beep(){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showToast(s){toast.textContent=s;toast.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.add('hidden'),1800)}
function screen(html){app.innerHTML='<section class="screen">'+html+'</section>';window.scrollTo({top:0,behavior:'smooth'})}
function button(text,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function home(){screen(`<div class="hero"><div class="hero-card"><img class="avatar" src="art/avatar/wave.png" alt="Friendly waving avatar"><div class="eyebrow">A tiny language adventure</div><h1>Aura<br>Book</h1><p>Build a little book in Italian, one bright sentence at a time.</p><div class="actions">${button('Start','start','btn green')}${button('See the model','model','btn light')}</div></div></div>`)}
const model=[['Ciao! Io sono Monte di Procida.','Hello! I am Monte di Procida.'],['Io abito in Campania.','I live in Campania.'],["Io sono nel sud d'Italia.",'I am in the south of Italy.'],['Io sono vicina al mare.','I am near the sea.'],['Io vedo i faraglioni.','I see the sea stacks.'],['Io amo i limoni.','I love lemons.'],['Tu visiti la Marina di Acquamorta.','You visit the Marina di Acquamorta.'],['Tu vedi il mare.','You see the sea.'],['Io ho un belvedere.','I have a viewpoint.'],['A presto!','See you soon!']];
function modelScreen(){screen(`<div class="round-head"><div><div class="eyebrow">A read-only example</div><h2>See the model</h2></div></div><div class="model-card"><div class="model-list">${model.map(x=>`<div class="model-line"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><div class="footer-actions">${button('← Back','home','btn light')}${button('Start the book','start','btn green')}</div></div>`)}
const english=['I am a famous Italian city.','I live in Campania.','I am in the south of Italy.','I am near the sea.','I have a famous town square.','I see the sea.','I love my history.','See you soon!'];
function round1(){round=1;screen(`<div class="round-head"><div><div class="eyebrow">Round 1 of 5</div><h2>Read the idea</h2></div><div class="progress">8 lines</div></div><p>Read each sentence. You will meet the Italian words next.</p><div class="card-grid">${english.map(x=>`<div class="line-card">${x}</div>`).join('')}</div><div class="footer-actions"><span></span>${button('Next →','round2','btn green')}</div>`)}
function tips(line){return line.split(/(\s+|(?=[.!?])|(?<=[.!?]))/).map(part=>{let clean=part.replace(/[.!?]/g,'');if(gloss[clean])return `<span class="tip" tabindex="0" data-gloss="${gloss[clean]}">${part}</span>`;return part}).join('')}
const italian=['Io sono una città italiana famosa.','Io abito in Campania.',"Io sono nel sud d'Italia.",'Io sono vicina al mare.','Io ho una piazza famosa.','Io vedo il mare.','Io amo la mia storia.','A presto!'];
function round2(){round=2;screen(`<div class="round-head"><div><div class="eyebrow">Round 2 of 5</div><h2>Meet the Italian</h2></div><div class="progress">Touch a word</div></div><div class="instructions">Hover or touch-hold an Italian word to see its English helper.</div><div class="italian-lines">${italian.map(x=>`<div class="italian-line">${tips(x)}</div>`).join('')}</div><div class="footer-actions">${button('← Back','round1','btn light')}${button('Next →','quiz','btn green')}</div>`);document.querySelectorAll('.tip').forEach(el=>{let t;el.addEventListener('touchstart',()=>{t=setTimeout(()=>el.classList.add('show'),350)},{passive:true});['touchend','touchcancel'].forEach(e=>el.addEventListener(e,()=>clearTimeout(t)));el.addEventListener('click',()=>el.classList.toggle('show'))})}
const quiz=[{text:'Io sono ____.',answer:'famosa',bank:['famosa','mare','pizza']},{text:'Io ____ il mare.',answer:'vedo',bank:['vedo','sono','piazza']},{text:'Io abito in ____.',answer:'Campania',bank:['Campania','Italia','Venezia']},{text:'A ____!',answer:'presto',bank:['presto','mare','famosa']}];
function quizScreen(){round=3;quizIndex=0;quizSolved=[];quizAttempts=0;renderQuiz()}
function renderQuiz(){let q=quiz[quizIndex];screen(`<div class="round-head"><div><div class="eyebrow">Round 3 of 5</div><h2>Fill the blanks</h2></div><div class="progress">${quizIndex+1} / ${quiz.length}</div></div><p>Drag a word into the sentence.</p><div class="blank-list"><div class="blank-row" data-answer="${q.answer}"><div class="sentence">${q.text.replace('____','<span class="dropzone" id="drop"></span>')}</div><div class="bank">${q.bank.map(w=>`<button class="word" draggable="true" data-word="${w}">${w}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div></div><div class="footer-actions">${button('← Back','round2','btn light')}<span></span></div>`);const drop=document.getElementById('drop');document.querySelectorAll('.word').forEach(w=>{w.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',w.dataset.word)});w.addEventListener('click',()=>tryQuiz(w.dataset.word));w.addEventListener('touchstart',()=>{window._touchWord=w.dataset.word},{passive:true});w.addEventListener('touchend',()=>{if(window._touchWord)tryQuiz(window._touchWord);window._touchWord=null})});drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();tryQuiz(e.dataTransfer.getData('text/plain'))})}
function tryQuiz(word){let q=quiz[quizIndex],fb=document.getElementById('feedback'),drop=document.getElementById('drop');if(word===q.answer){beep();drop.textContent=word;drop.classList.add('filled','correct');document.querySelectorAll('.word').forEach(x=>{if(x.dataset.word===word)x.classList.add('used')});fb.textContent='Nice!';quizSolved[quizIndex]=true;quizAttempts=0;setTimeout(()=>{quizIndex++;quizIndex<quiz.length?renderQuiz():cities()},500)}else{beep();quizAttempts++;if(quizAttempts===1){fb.textContent='Not this one. Try again.';return}let right=document.querySelector(`.word[data-word="${q.answer}"]`);if(right){drop.textContent=q.answer;drop.classList.add('filled','correct');right.classList.add('used');fb.textContent='Here is the right word — keep going!';quizSolved[quizIndex]=true;quizAttempts=0;setTimeout(()=>{quizIndex++;quizIndex<quiz.length?renderQuiz():cities()},700)}}}
const citiesData={Roma:{english:'Rome',region:'Lazio',place:'centro',fact:['Lo sapevi che Roma ha moltissime fontane?','Did you know Rome has lots and lots of fountains?']},Napoli:{english:'Naples',region:'Campania',place:'sud',fact:['Lo sapevi che la pizza Margherita ha il nome della regina Margherita?','Did you know the Margherita pizza is named for Queen Margherita?']},Firenze:{english:'Florence',region:'Toscana',place:'centro',fact:['Lo sapevi che il Duomo di Firenze è enorme?','Did you know Florence\'s cathedral is huge?']},Venezia:{english:'Venice',region:'Veneto',place:'nord',fact:['Lo sapevi che Venezia è fatta di tante isole?','Did you know Venice is made of many islands?']},Torino:{english:'Turin',region:'Piemonte',place:'nord',fact:['Lo sapevi che Torino ha un museo egizio famoso?','Did you know Turin has a famous Egyptian museum?']}};
function cities(){round=4;screen(`<div class="round-head"><div><div class="eyebrow">Round 4 of 5</div><h2>Choose a city</h2></div><div class="progress">5 places</div></div><p>Discover a city, then make its book.</p><div class="city-grid">${Object.entries(citiesData).map(([name,d])=>`<div class="city-card"><h3>${name}</h3><div class="english">${d.english}</div>${button('Scopri '+name,`discover:${name}`,'btn coral')}</div>`).join('')}</div><div class="footer-actions">${button('← Back','quiz','btn light')}<span></span></div>`)}
function discover(name){city=name;let d=citiesData[name];screen(`<div class="model-card"><div class="eyebrow">A city secret</div><h2>${name}</h2><p class="english">${d.english} · ${d.region} · ${d.place}</p><div class="fact"><div>${d.fact[0]}</div><em>${d.fact[1]}</em></div><div class="footer-actions">${button('← Cities','cities','btn light')}${button('Make this book','bookstart','btn green')}</div></div>`)}
const pageNames=['Cover','Hello','Where','What I’m like','What I have','What I see','What I love','You','Food','Bye'];
function chipSentences(){let d=citiesData[city];let arr=[`Ciao! Io sono ${city}.`,'Io sono una città italiana',`Io abito in ${d.region}.`,`Io sono nel ${d.place} d'Italia.`,'Io sono famosa.','Io sono vicina al mare.','Io sono vicina alle montagne.','Io ho una piazza famosa.','Io vedo il mare.','Io vedo le montagne.','Io amo la mia storia.','Tu vedi il mare.','Tu ami la pizza.','Tu ami il cioccolato.','A presto!'];if(city==='Torino')arr=arr.filter(x=>!x.includes('mare'));if(city==='Venezia')arr=arr.filter(x=>!x.includes('montagne'));return arr}
function bookstart(){round=5;page=0;bookPlaced=Array.from({length:10},()=>[]);placed=bookPlaced[0];renderBook()}
function chipsForPage(){const all=chipSentences();if(page===0)return [];const start=((page-1)*4)%all.length;return [0,1,2,3].map(i=>all[(start+i)%all.length])}
function renderBook(){placed=bookPlaced[page]||[];let chips=chipsForPage(), isCover=page===0;screen(`<div class="book-shell"><div class="page-nav">${button('←','bookPrev','btn light')}<div class="page-title">Page ${page+1} of 10 · ${pageNames[page]}</div>${button('→','bookNext','btn green')}</div><div class="book-page ${isCover?'book-cover':''}"><div class="page-content">${isCover?`<div class="eyebrow">${city}</div><h2>My Aura<br>Book</h2><p>A little book in Italian.</p>`:`<h2>${pageNames[page]}</h2><p class="page-note">Choose at least 2 sentences for this page.</p><div class="chip-bank">${chips.map((x,i)=>`<button class="chip" draggable="true" data-chip="${i}">${esc(x)}</button>`).join('')}</div><div class="placed" id="placed">${placed.map((x,i)=>`<div class="placed-chip" data-remove="${i}" title="Click to remove">${esc(x)}</div>`).join('')}</div>`}</div></div>${!isCover?'<div class="page-note">Click a placed sentence to remove it.</div>':''}<div class="footer-actions">${page===0?button('← Cities','cities','btn light'):button('Reset page','resetPage','btn light')}${page===9?button('This page is done','finishBook','btn green'):button('This page is done','bookNext','btn green')}</div></div>`);if(!isCover)wireChips()}
function wireChips(){document.querySelectorAll('.chip').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.chip)});el.addEventListener('click',()=>addChip(+el.dataset.chip))});let zone=document.getElementById('placed');zone.addEventListener('dragover',e=>e.preventDefault());zone.addEventListener('drop',e=>{e.preventDefault();addChip(+e.dataTransfer.getData('text/plain'))});document.querySelectorAll('.placed-chip').forEach(el=>el.addEventListener('click',()=>{placed.splice(+el.dataset.remove,1);bookPlaced[page]=placed;beep();renderBook()}))}
function addChip(i){let s=chipsForPage()[i];if(s&&!placed.includes(s)){placed.push(s);bookPlaced[page]=placed;beep();renderBook()}}
function resetPage(){placed=[];bookPlaced[page]=placed;renderBook()}
function bookPrev(){if(page>0){page--;placed=bookPlaced[page]||[];renderBook()}else cities()}
function bookNext(){if(page===0){page++;placed=bookPlaced[page]||[];renderBook();return}if(placed.length<2){showToast('Add at least 2 sentences first.');return}bookPlaced[page]=placed;if(page<9){page++;placed=bookPlaced[page]||[];renderBook()}else finishBook()}
function finishBook(){let pages=pageNames.map((n,i)=>({name:n,lines:i===0?[`My Aura Book · ${city}`]:[]}));pages.forEach((p,i)=>{if(i>0)p.lines=bookPlaced[i]||[]});screen(`<div class="finished"><div class="hero-card" style="margin-bottom:18px"><img class="avatar end" src="art/avatar/celebrate.png" alt="Celebrating avatar"><div class="eyebrow">Libro completo!</div><h2>Your Aura Book</h2><p>You made a book for ${city}.</p></div><div class="final-book">${pages.map(p=>`<div class="final-page"><h3>${p.name}</h3>${p.lines.length?p.lines.map(x=>`<p>${esc(x)}</p>`).join(''):'<p class="english">A bright blank page, ready for more.</p>'}</div>`).join('')}</div><div class="footer-actions">${button('Make another','start','btn light')}${button('Start over','home','btn green')}</div></div>`)}
const actions={home,start,model,round1,round2,quiz:quizScreen,cities,bookstart,bookPrev,bookNext,resetPage,finishBook};
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;beep();let [a,arg]=b.dataset.action.split(':');if(a==='discover')return discover(arg);if(actions[a])actions[a]()});
document.getElementById('muteBtn').addEventListener('click',()=>{sound=!sound;document.getElementById('muteBtn').textContent=sound?'🔊':'🔇'});document.getElementById('projectorBtn').addEventListener('click',()=>{projector=!projector;document.body.classList.toggle('projector',projector)});home();
</script>
</body>
</html>
