<style>
:root{--bg:#f6f1e6;--card:#fffaf2;--ink:#1c1915;--teal:#0f766e;--line:#e4d8c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.35}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#shell{width:min(100%,480px);height:100dvh;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--bg);overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{font-weight:900;font-size:1.15rem;color:var(--ink);letter-spacing:-.02em}
.controls{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--ink);font-weight:900;font-size:1.15rem;color:var(--ink);display:grid;place-items:center}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);border-width:3px;background:#efe6d4;color:var(--ink)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.home,.cities{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px 4px 12px}
.home{justify-content:center}
.hello{width:120px;height:68px;overflow:hidden;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.hello img{width:120px;height:auto;display:block;object-position:center top}
h1{font-size:clamp(2.6rem,11vw,3.4rem);line-height:1.15;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:0}
.tagline{font-size:1.2rem;font-weight:800;color:var(--ink);margin:0;max-width:20rem}
.teal{min-height:64px;width:min(100%,320px);border-radius:18px;padding:12px 16px;background:var(--teal);color:#fff;font-weight:900;font-size:1.45rem;border:2px solid var(--teal)}
.teal small{color:#fff;font-weight:800}
.city-list{width:100%;display:flex;flex-direction:column;gap:10px}
.city-btn{width:100%;min-height:72px;border-radius:20px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:1.7rem}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.route{flex:0 0 auto;position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:62px;margin:0 4px;padding:0 2px}
.route:before{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;background:var(--line);border-radius:99px}
.stop{position:relative;width:16px;height:16px;flex:0 0 auto;z-index:1}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);display:block}
.stop.done .dot{background:var(--teal);border-color:var(--teal)}
.stop.now .dot{background:var(--card);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.walker{position:absolute;left:50%;bottom:12px;width:64px;height:36px;transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:2}
.walker img{width:64px;height:auto;display:block}
.card{flex:1;min-height:0;width:100%;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;color:var(--ink)}
.card.open{border-color:var(--teal)}
.card img.shot{width:100%;height:min(34dvh,250px);object-fit:cover;border-radius:16px;border:2px solid var(--line);background:var(--bg);flex:0 0 auto}
.it{font-size:clamp(1.85rem,7.4vw,2.55rem);line-height:1.2;font-weight:900;color:var(--ink);margin:0}
.en{color:var(--teal);font-weight:800;font-size:clamp(1.05rem,4vw,1.28rem);line-height:1.35;margin:0}
.tap{font-weight:800;color:var(--ink);font-size:1rem;margin:0}
.dock{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.plain{min-height:56px;border-radius:18px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:1.15rem}
body.big .it{font-size:clamp(2.35rem,9vw,3.15rem)}
body.big .en{font-size:1.4rem}
body.big h1{font-size:3.5rem}
body.big .city-btn{font-size:2rem;min-height:84px}
@media (max-height:700px){
  .card img.shot{height:min(28dvh,190px)}
  .hello{width:96px;height:54px}
  h1{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.part{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.part-h{flex:0 0 auto;display:flex;flex-direction:column;gap:2px}
.kicker{margin:0;font-weight:900;color:var(--teal);font-size:1.15rem;line-height:1.2}
.where{margin:0;font-weight:800;color:var(--ink);font-size:1.15rem;line-height:1.2}

.scroll>*,.zone>*{flex:0 0 auto}
.row{display:flex;flex-direction:column;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px;color:var(--ink);max-width:100%}
.row img{width:100%;height:110px;object-fit:cover;object-position:center 65%;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.line{margin:0;font-weight:900;color:var(--ink);font-size:clamp(1.4rem,5.4vw,1.8rem);line-height:1.25;overflow-wrap:anywhere}
.moves{display:flex;flex-wrap:wrap;gap:8px}
.mini{flex:1 1 30%;min-height:56px;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:1.05rem;padding:8px}
.row.dragging{border-color:var(--teal)}
.choice,.word{width:100%;min-height:64px;border-radius:18px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;padding:12px 14px;text-align:left}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:clamp(1.25rem,5vw,1.6rem)}
.word{font-size:clamp(1.35rem,5.4vw,1.8rem);text-align:center}
.choice.on,.word.on{border-color:var(--teal);border-width:3px}
.blank{display:inline-block;min-width:4.5rem;padding:0 .15rem;border-bottom:3px solid var(--ink);color:var(--ink)}
.status{min-height:1.4em;margin:4px 0 0;font-weight:800;color:var(--ink);text-align:center;font-size:1.15rem}
.zone{min-height:92px;border:2px solid var(--line);border-radius:20px;background:var(--card);padding:8px;display:flex;flex-direction:column;gap:8px}
.zone.over{border-color:var(--teal)}
.drag-ghost{position:fixed;z-index:20;pointer-events:none;background:var(--card);color:var(--ink);border:2px solid var(--teal);border-radius:16px;padding:10px 14px;font-weight:900;font-size:1.15rem;max-width:min(280px,80vw)}
.num{font-weight:900;color:var(--ink);font-size:1.2rem;margin:0}
.row.ok{border-color:var(--teal);border-width:3px}
.drag{touch-action:none}
.pic{width:100%;height:min(30dvh,220px);object-fit:cover;border-radius:16px;border:2px solid var(--line);background:var(--bg);flex:0 0 auto}
.label{margin:6px 0 0;font-weight:900;color:var(--ink);font-size:1.2rem}
.center{justify-content:center;align-items:center;text-align:center}
.part .teal:disabled{background:var(--card);color:var(--ink);border-color:var(--ink);cursor:default}
.part .dock .teal{width:100%}
.wide{width:100%;min-height:60px}
.part .teal.wide{width:100%}
.row.picked{border-color:var(--teal);border-width:3px;background:#efe6d4}
.mini.put{border-color:var(--teal);border-width:3px}
.hintbox{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;background:var(--card);border:3px solid var(--teal);border-radius:20px;padding:10px;color:var(--ink)}
.hintbox img{width:100%;height:110px;object-fit:cover;object-position:center 65%;border-radius:14px;border:2px solid var(--line)}
body.big .ask{font-size:2.4rem}
body.big .line{font-size:2rem}
body.big .kicker,body.big .where,body.big .mini{font-size:1.25rem}
body.big .word,body.big .choice{font-size:1.7rem}
@media (max-height:700px){
  .row img{height:72px}
}
</style>
</head>

var muted=false, city=null, index=0, open=false;
function say(text){
  if(muted||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang="it-IT";
  window.speechSynthesis.speak(u);
}
function hush(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }
muteBtn.addEventListener("click",function(){
  muted=!muted;

  muteBtn.setAttribute("aria-label", muted?"Unmute":"Mute");
  if(muted) hush();
});
bigBtn.addEventListener("click",function(){
  var on=document.body.classList.toggle("big");
  bigBtn.setAttribute("aria-pressed", on?"true":"false");
});
function home(){

  document.getElementById("start").onclick=cities;
}
function cities(){
  hush(); city=null; brand.textContent="Mi sono perso";

  view.innerHTML=html;
  view.querySelectorAll(".city-btn").forEach(function(b){
    b.onclick=function(){ startCity(Number(b.getAttribute("data-i"))); };
  });
}
function startCity(i){ city=CITIES[i]; index=0; open=false; brand.textContent=city.name; render(); }
function render(){
  var stops=city.stops, s=stops[index];

  for(var i=0;i<stops.length;i++){
    var cls=i<index?"done":(i===index?"now":"");
    dots+='<div class="stop '+cls+'">'+(i===index?'<div class="walker"><img src="art/avatar/wave.png" alt=""></div>':'')+'<i class="dot"></i></div>';
  }
  view.innerHTML=
    '<div class="stage">'+
    '<div class="route" aria-hidden="true">'+dots+'</div>'+
    '<button type="button" class="card'+(open?" open":"")+'" id="card" aria-expanded="'+(open?"true":"false")+'">'+
    '<img class="shot" src="'+s.img+'" alt="'+s.alt.replace(/"/g,"&quot;")+'">'+
    '<p class="it" lang="it">'+s.it+'</p>'+
    (open?'<p class="en" lang="en">'+s.en+'</p>':'<p class="tap">Tocca</p>')+
    '</button>'+
    '<div class="dock">'+
    '<button type="button" class="plain" id="back">'+(index===0?"Città":"Indietro")+'</button>'+
    '<button type="button" class="teal" id="next">'+(index===stops.length-1?"Parte 2":"Avanti")+'</button>'+
    '</div></div>';
  document.getElementById("card").onclick=function(){ open=!open; render(); };
  document.getElementById("back").onclick=function(){ if(index===0) cities(); else { index--; open=false; render(); } };
  document.getElementById("next").onclick=goNext;

function go(step){ hush(); p2.step=step; p2.msg=""; p2.pick=null; p2.hint=null; p2.tip=null; p2Render(); }
function p2Back(){
  if(p2.step===0){ index=city.stops.length-1; open=false; render(); return; }
  if(p2.step===3&&p2.b>0){ p2.b--; p2.msg=""; p2Render(); return; }
  if(p2.step===4){ p2.b=p2.data.blanks.length-1; }
  if(p2.step===5&&p2.play>0){ p2.play--; p2Render(); return; }
  go(p2.step===6?4:p2.step-1);
}
function p2Next(){
  var d=p2.data;
  if(p2.step===1&&!p2.solved){
    var right=p2.order.filter(function(v,i){ return v===i; }).length;
    p2.checked=true;
    if(right===p2.order.length){ p2.solved=true; p2.msg="Perfetto! All in order."; }
    else p2.msg="Quasi! "+right+" of "+p2.order.length+" are in the right place.";
    p2Render(); return;
  }
  if(p2.step===3&&p2.b<d.blanks.length-1){ p2.b++; p2.msg=""; p2Render(); return; }
  if(p2.step===5){
    if(p2.play<p2.walk.length-1){ p2.play++; p2Render(); return; }
    go(6); return;
  }
  if(p2.step===4) p2.play=0;
  if(p2.step===6){ cities(); return; }
  go(p2.step+1);
}
function p2Bind(){
  var d=p2.data;
  document.getElementById("p2back").onclick=p2Back;
  document.getElementById("p2next").onclick=p2Next;
  var again=document.getElementById("again");
  if(again) again.onclick=function(){ p2.play=0; go(5); };
  view.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(){
      var pos=Number(b.getAttribute("data-pos")), act=b.getAttribute("data-act");
      var arr=b.getAttribute("data-kind")==="order"?p2.order:p2.walk;
      if(act==="pick"){ p2.pick=pos; p2.msg="Ora tocca Metti qui. · Now tap Metti qui where it goes."; p2Render(); return; }
      if(act==="cancel"){ p2.pick=null; p2.msg=""; p2Render(); return; }
      if(act==="put"){ var item=arr.splice(p2.pick,1)[0]; arr.splice(pos,0,item); }
      else if(act==="remove"){ p2.walk.splice(pos,1); }
      else if(act==="up"){ if(pos>0) moveItem(arr,pos,pos-1); }
      else if(pos<arr.length-1){ moveItem(arr,pos,pos+2); }
      afterChange();
    };
  });
  view.querySelectorAll("[data-add]").forEach(function(b){
    b.onclick=function(){ addToWalk(Number(b.getAttribute("data-add")),p2.walk.length); };
  });
  var hintBtn=document.getElementById("hintBtn");
  if(hintBtn) hintBtn.onclick=orderHint;
  var tipBtn=document.getElementById("tipBtn");
  if(tipBtn) tipBtn.onclick=walkTip;
  var tipAdd=document.getElementById("tipAdd");
  if(tipAdd) tipAdd.onclick=function(){ var bi=p2.tip; p2.tip=null; addToWalk(bi,tipSpot(bi)); };
  view.querySelectorAll("[data-match]").forEach(function(b){
    b.onclick=function(){
      var k=Number(b.getAttribute("data-match"));
      if(k===0){ p2.matchOk=true; p2.msg="Sì! Giusto."; say(d.match[1][0]); }
      else p2.msg="Prova ancora. Try again.";
      p2Render();
    };
  });
  view.querySelectorAll("[data-word]").forEach(function(b){
    b.onclick=function(){
      var q=d.blanks[p2.b], w=b.getAttribute("data-word");
      if(!q[2]){ p2.gender=w; p2.fills[p2.b]=w; p2.msg="Sì!"; say(q[0]+w+q[1]); }
      else if(w===q[2]){ p2.fills[p2.b]=w; p2.msg="Sì! Giusto."; say(q[0]+w+q[1]); }
      else p2.msg="Prova ancora. Try again.";
      p2Render();
    };
  });
}
function afterChange(){
  p2.checked=false; p2.pick=null; p2.msg="";
  if(p2.step===1&&p2.order.every(function(v,i){ return v===i; })){ p2.solved=true; p2.hint=null; p2.msg="Perfetto! All in order. Tap Avanti."; }
  p2Render();
}
function orderHint(){
  var pos=p2.order.findIndex(function(v,i){ return v!==i; });
  if(pos<0){ afterChange(); return; }
  p2.order.splice(p2.order.indexOf(pos),1);
  p2.order.splice(pos,0,pos);
  if(p2.hinted.indexOf(pos)<0) p2.hinted.push(pos);
  afterChange();
  if(!p2.solved){ p2.hint=pos; p2.msg="Riga "+(pos+1)+" è al suo posto. · Line "+(pos+1)+" is now in place."; p2Render(); }
  say(city.stops[pos].it);
}
function suggested(){
  var bank=p2.data.bank;
  return p2.data.suggest.map(function(it){ return bank.findIndex(function(s){ return s[0]===it; }); });
}
function walkTip(){
  if(p2.walk.length>=8){ p2.tip=null; p2.msg="Basta così! Tap Guarda."; p2Render(); return; }
  var next=suggested().find(function(bi){ return p2.walk.indexOf(bi)<0; });
  if(next===undefined) next=p2.data.bank.findIndex(function(s,bi){ return p2.walk.indexOf(bi)<0; });
  p2.tip=next<0?null:next;
  p2.msg=p2.walk.length>=6?"La passeggiata è pronta. You can tap Guarda now.":"";
  p2Render();
}
function tipSpot(bi){
  var sug=suggested(), rank=sug.indexOf(bi), at=0;
  if(rank<0) return p2.walk.length;
  p2.walk.forEach(function(w,i){ var r=sug.indexOf(w); if(r>=0&&r<rank) at=i+1; });
  return at;
}
function addToWalk(bi,at){
  if(p2.walk.length>=8){ p2.msg="Basta così: 8 is the most."; p2Render(); return; }
  p2.walk.splice(at,0,bi); p2.pick=null; p2.msg=""; p2Render();
}
home();
</script>
