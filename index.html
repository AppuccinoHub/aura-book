<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0614">
<title>Aura Book</title>
<style>
:root{
  --bg:#0a0614;--card:#1a0f2e;--neon:#c44dff;--teal:#00f5d4;--pink:#ff4d9e;--gold:#ffd166;--text:#f5f0ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#shell{
  width:min(100%,480px);height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;min-height:0;
  padding:
    max(8px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));
  background:
    radial-gradient(ellipse at 12% -8%,rgba(196,77,255,.5),transparent 46%),
    radial-gradient(ellipse at 110% 8%,rgba(255,77,158,.35),transparent 42%),
    radial-gradient(ellipse at 50% 120%,rgba(0,245,212,.18),transparent 46%),
    var(--bg);
  overflow:hidden;
}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{font-weight:900;font-size:1.2rem;color:var(--gold);letter-spacing:-.03em}
.controls{display:flex;gap:8px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;background:var(--card);
  border:2px solid var(--neon);box-shadow:0 4px 0 #6a1ea3;
  font-weight:900;font-size:1.15rem;color:var(--text);
  display:grid;place-items:center;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6a1ea3}
.icon-btn[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.dock{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav.two{grid-template-columns:1fr 1fr}
.btn{
  min-height:56px;border-radius:18px;padding:6px 8px;
  background:var(--pink);color:var(--text);font-weight:900;
  box-shadow:0 5px 0 #9a1858;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
}
.btn b{font-size:1rem}
.btn small{font-size:.75rem;font-weight:800;color:var(--text)}
.btn.teal{background:var(--teal);color:var(--bg);box-shadow:0 5px 0 #08786a}
.btn.teal small{color:var(--bg)}
.btn.ghost{background:var(--card);color:var(--text);border:2px solid var(--neon);box-shadow:0 5px 0 #6a1ea3}
.btn.ghost small{color:var(--teal)}
.btn.gold{background:var(--card);color:var(--gold);border:3px solid var(--gold);box-shadow:0 5px 0 #9a6a00}
.btn.gold small{color:var(--text)}
.btn[aria-pressed="true"]{background:var(--teal);color:var(--bg);border-color:var(--teal);box-shadow:0 5px 0 #08786a}
.btn[aria-pressed="true"] small{color:var(--bg)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6a1ea3}
.home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:6px 4px 8px}
.avatar-frame{
  width:min(78vw,280px);overflow:hidden;border-radius:32px;
  border:4px solid var(--gold);background:transparent;
  box-shadow:0 0 0 5px var(--pink),0 8px 0 #6a1ea3,0 0 28px rgba(196,77,255,.45);
}
.avatar-frame.hi{aspect-ratio:385/220}
.avatar-frame.party{aspect-ratio:381/190}
.avatar-frame img{width:100%;height:auto;display:block;pointer-events:none}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--pink);color:var(--text);font-weight:900;
  border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 #9a1858;
}
.pill.good{background:var(--teal);color:var(--bg);box-shadow:0 4px 0 #08786a}
h1{font-size:clamp(2.7rem,11vw,3.6rem);line-height:.92;font-weight:900;color:var(--gold);letter-spacing:-.04em;text-shadow:0 4px 0 #6a1ea3}
.tagline{font-size:1.2rem;font-weight:800;color:var(--text);max-width:20rem}
.home .btn{width:min(100%,320px);min-height:64px}
.home .btn b{font-size:1.35rem}
.toprow{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-weight:900;color:var(--teal);letter-spacing:.04em;text-transform:uppercase;font-size:.95rem}
.count{font-weight:900;color:var(--gold)}
.dots{flex:0 0 auto;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;border:2px solid var(--gold);transform:rotate(-8deg);display:block}
.dots i.on{background:var(--teal);border-color:var(--teal)}
.dots i.now{background:var(--pink);border-color:var(--gold);transform:rotate(8deg) scale(1.15)}
.postcard{
  flex:1 1 auto;min-height:180px;width:100%;text-align:center;position:relative;
  border-radius:28px;padding:16px 14px 14px;
  background:linear-gradient(165deg,#2a1548 0%,var(--card) 70%);
  box-shadow:0 8px 0 #6a1ea3,0 0 0 3px var(--neon);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  overflow:auto;
}
.postcard.open{box-shadow:0 8px 0 #08786a,0 0 0 3px var(--teal)}
.postcard:active{transform:translateY(3px)}
.seal{
  width:92px;height:92px;border-radius:50%;border:3px dashed var(--gold);
  display:grid;place-items:center;background:rgba(255,209,102,.08);transform:rotate(8deg);flex:0 0 auto;
}
.seal .pic{width:74px;height:74px}
.it-hero{
  font-size:clamp(1.7rem,6.6vw,2.45rem);line-height:1.22;font-weight:900;color:var(--gold);
}
.flap{width:100%;background:#10241f;border:2px dashed var(--teal);border-radius:16px;padding:10px 12px}
.en{display:block;color:var(--teal);font-weight:800;font-size:clamp(1.05rem,4vw,1.3rem);line-height:1.3;margin-top:4px}
.tap{font-weight:800;color:var(--teal);font-size:1rem}
.hint{flex:0 0 auto;text-align:center;font-weight:800;color:var(--text);font-size:1rem}
.note{text-align:center;font-weight:900;color:var(--gold);font-size:1.05rem}
.pic{width:64px;height:64px;display:block;flex:0 0 auto}
.city{
  width:100%;text-align:left;background:var(--card);border:3px solid var(--neon);
  border-radius:22px;padding:12px;margin-bottom:10px;box-shadow:0 5px 0 #6a1ea3;color:var(--text);
}
.city-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.cname{display:block;font-size:1.7rem;font-weight:900;color:var(--gold);line-height:1}
.gossip{display:block;font-size:clamp(1.15rem,4.2vw,1.35rem);font-weight:900;color:var(--text);line-height:1.25}
.go{
  margin-top:10px;min-height:48px;border-radius:14px;background:var(--pink);color:var(--text);
  font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #9a1858;
}
.go small{font-weight:800;font-size:.75rem}
.pass{
  background:var(--card);border:3px solid var(--gold);border-radius:24px;padding:12px;
  box-shadow:0 8px 0 #6a1ea3;
}
.cover-block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 4px}
.cityname{font-size:clamp(2.4rem,12vw,3.5rem);font-weight:900;color:var(--gold);line-height:.95}
.wait{text-align:center;padding:8px 4px 4px}
.stamps3{display:flex;gap:10px;justify-content:center}
.ghost-stamp{width:42px;height:42px;border:3px dashed var(--gold);border-radius:12px;transform:rotate(-8deg)}
.wait .ask{margin-top:8px;font-size:1.25rem;font-weight:900;color:var(--gold)}
.placed{
  width:100%;display:flex;gap:8px;align-items:center;text-align:left;
  background:#221438;border:3px solid var(--gold);border-radius:16px;padding:8px;margin-top:8px;
  box-shadow:0 4px 0 #9a6a00;min-height:64px;
}
.placed .pic{width:52px;height:52px}
.line-it{display:block;font-size:clamp(1.6rem,4.6vw,1.85rem);font-weight:900;color:var(--text);line-height:1.2}
.stickers{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sticker{
  width:100%;min-height:72px;display:flex;gap:10px;align-items:center;text-align:left;
  background:#221438;border:3px solid var(--neon);border-radius:18px;padding:8px;
  box-shadow:0 4px 0 #6a1ea3;
}
.sticker.on{border-color:var(--gold);box-shadow:0 4px 0 #9a6a00}
.sticker .it{font-size:1.2rem;font-weight:900;color:var(--gold);line-height:1.2}
.page-en{color:var(--teal);font-weight:800;font-size:1rem}
.final{
  background:var(--card);border:3px solid var(--neon);border-radius:20px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 6px 0 #6a1ea3;
}
.final h3{color:var(--gold);font-size:1.35rem;font-weight:900;margin-bottom:6px}
.final .line-it{font-size:1.6rem}
body.projector .it-hero{font-size:clamp(2rem,8vw,3rem)}
body.projector .line-it{font-size:1.9rem}
body.projector .tagline,body.projector .hint,body.projector .gossip{font-size:1.35rem}
body.projector .sticker .it{font-size:1.4rem}
body.projector .en{font-size:1.35rem}
body.projector h1{font-size:4rem}
@media (max-height:700px){
  .avatar-frame{width:min(62vw,210px)}
  .seal{width:72px;height:72px}
  .seal .pic{width:58px;height:58px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="shell">
<header>
  <div class="brand">✦ Passaporto</div>
  <div class="controls">
    <button type="button" class="icon-btn" id="muteBtn" aria-label="Mute sounds" aria-pressed="false">🔊</button>
    <button type="button" class="icon-btn" id="projBtn" aria-label="Projector text size" aria-pressed="false">Aa</button>
  </div>
</header>
<main id="view"></main>
</div>
<script>
const MODEL=[
["Ciao! Io sono Monte di Procida.","Hello! I am Monte di Procida.","wave"],
["Io abito in Campania.","I live in Campania.","house"],
["Io sono nel sud d'Italia.","I am in the south of Italy.","compass"],
["Io sono vicina al mare.","I am near the sea.","sea"],
["Io vedo i faraglioni.","I see the sea stacks.","stacks"],
["Io amo i limoni.","I love lemons.","lemon"],
["Tu visiti la Marina di Acquamorta.","You visit Marina di Acquamorta.","harbor"],
["Tu vedi il mare.","You see the sea.","sea"],
["Io ho un belvedere.","I have a viewpoint.","view"],
["A presto!","See you soon!","wave"]
];
const CITIES={
Roma:{en:"Rome",region:"Lazio",place:"centro",placeEn:"center",icon:"fountain",
it:"Lo sapevi che Roma ha moltissime fontane?",
enFact:"Did you know Rome has lots and lots of fountains?"},
Napoli:{en:"Naples",region:"Campania",place:"sud",placeEn:"south",icon:"pizza",
it:"Lo sapevi che la pizza Margherita ha il nome della regina Margherita?",
enFact:"Did you know Margherita pizza is named for Queen Margherita of Savoy?"},
Firenze:{en:"Florence",region:"Toscana",place:"centro",placeEn:"center",icon:"cathedral",
it:"Lo sapevi che il Duomo di Firenze è enorme?",
enFact:"Did you know Florence's cathedral is huge?"},
Venezia:{en:"Venice",region:"Veneto",place:"nord",placeEn:"north",icon:"islands",
it:"Lo sapevi che Venezia è fatta di tante isole?",
enFact:"Did you know Venice is made of many islands?"},
Torino:{en:"Turin",region:"Piemonte",place:"nord",placeEn:"north",icon:"museum",
it:"Lo sapevi che Torino ha un museo egizio famoso?",
enFact:"Did you know Turin has a famous Egyptian museum?"}
};
const PAGES=["Cover","Dove abito","Com'è","Cosa vedo","Cosa amo","Ciao"];
const PAGE_EN=["Your city","Where I live","What it is like","What I see","What I love","Goodbye"];
const PICS={
wave:'<circle cx="30" cy="40" r="11" fill="#ffd166"/><rect x="25" y="18" width="5" height="16" rx="2.5" fill="#ffd166"/><rect x="32" y="15" width="5" height="18" rx="2.5" fill="#ffd166"/><rect x="39" y="20" width="5" height="14" rx="2.5" fill="#ff4d9e"/><path d="M12 20c7 2 8 9 3 12M10 32c6 1 7 7 2 9" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>',
sea:'<circle cx="46" cy="16" r="6" fill="#ffd166"/><path d="M6 34c7 8 11-8 18 0s11-8 18 0 11-8 16 0" fill="none" stroke="#00f5d4" stroke-width="4" stroke-linecap="round"/><path d="M6 48c7 8 11-8 18 0s11-8 18 0 11-8 16 0" fill="none" stroke="#c44dff" stroke-width="4" stroke-linecap="round"/>',
lemon:'<ellipse cx="34" cy="36" rx="14" ry="18" fill="#ffd166" transform="rotate(-18 34 36)"/><path d="M30 16c8-10 16 0 8 8-5-2-7 0-8-8z" fill="#00f5d4"/><circle cx="30" cy="36" r="2.2" fill="#c44dff"/><circle cx="36" cy="42" r="2.2" fill="#ff4d9e"/><circle cx="33" cy="32" r="2" fill="#c44dff"/>',
fountain:'<ellipse cx="32" cy="52" rx="20" ry="6" fill="#c44dff"/><ellipse cx="32" cy="40" rx="14" ry="5" fill="#00f5d4"/><ellipse cx="32" cy="30" rx="8" ry="4" fill="#ffd166"/><rect x="30" y="14" width="4" height="16" rx="2" fill="#00f5d4"/><circle cx="32" cy="13" r="3.5" fill="#f5f0ff"/>',
pizza:'<path d="M32 8 L56 52 H8 Z" fill="#ffd166"/><path d="M32 18 L48 48 H16 Z" fill="#ff4d9e"/><circle cx="30" cy="36" r="3" fill="#00f5d4"/><circle cx="38" cy="42" r="3" fill="#ffd166"/><circle cx="27" cy="44" r="2.4" fill="#c44dff"/>',
cathedral:'<polygon points="32,6 48,30 16,30" fill="#ffd166"/><rect x="18" y="30" width="28" height="24" fill="#c44dff"/><rect x="12" y="36" width="7" height="18" fill="#ff4d9e"/><rect x="45" y="36" width="7" height="18" fill="#ff4d9e"/><circle cx="32" cy="22" r="4" fill="#00f5d4"/><rect x="28" y="40" width="8" height="14" fill="#0a0614"/>',
islands:'<ellipse cx="32" cy="46" rx="24" ry="10" fill="#00f5d4"/><ellipse cx="22" cy="40" rx="12" ry="8" fill="#ffd166"/><ellipse cx="44" cy="42" rx="10" ry="7" fill="#c44dff"/><path d="M18 34c2-10 10-8 8 2" fill="#00f5d4"/>',
museum:'<polygon points="6,28 32,10 58,28" fill="#ffd166"/><rect x="12" y="28" width="40" height="24" fill="#c44dff"/><rect x="18" y="34" width="6" height="18" fill="#f5f0ff"/><rect x="29" y="34" width="6" height="18" fill="#f5f0ff"/><rect x="40" y="34" width="6" height="18" fill="#f5f0ff"/>',
mountains:'<polygon points="4,56 24,16 40,56" fill="#c44dff"/><polygon points="22,56 44,12 62,56" fill="#ffd166"/><polygon points="38,24 44,12 50,24" fill="#f5f0ff"/>',
square:'<rect x="6" y="28" width="14" height="22" fill="#c44dff"/><rect x="44" y="24" width="14" height="26" fill="#ff4d9e"/><rect x="22" y="34" width="20" height="16" fill="#ffd166"/><circle cx="32" cy="26" r="6" fill="#00f5d4"/><rect x="6" y="50" width="52" height="5" rx="2" fill="#f5f0ff"/>',
stacks:'<circle cx="50" cy="14" r="5" fill="#ffd166"/><polygon points="14,50 22,14 32,50" fill="#f5f0ff"/><polygon points="34,50 44,20 56,50" fill="#c44dff"/><path d="M4 50h56v8H4z" fill="#00f5d4"/>',
view:'<circle cx="48" cy="16" r="7" fill="#ffd166"/><rect x="10" y="34" width="4" height="16" fill="#f5f0ff"/><rect x="30" y="34" width="4" height="16" fill="#f5f0ff"/><rect x="50" y="34" width="4" height="16" fill="#f5f0ff"/><path d="M6 38h52M6 50h52" stroke="#00f5d4" stroke-width="4" stroke-linecap="round"/>',
story:'<path d="M12 14h18c6 6 6 30 0 36H12z" fill="#c44dff"/><path d="M52 14H34c-6 6-6 30 0 36h18z" fill="#ff4d9e"/><path d="M32 28c4-7 12-4 12 3 0 8-12 14-12 14S20 39 20 31c0-7 8-10 12-3z" fill="#ffd166"/>',
chocolate:'<rect x="12" y="14" width="40" height="36" rx="6" fill="#ff4d9e"/><path d="M12 26h40M12 38h40M25 14v36M39 14v36" stroke="#ffd166" stroke-width="3"/>',
city:'<rect x="8" y="28" width="14" height="26" fill="#c44dff"/><rect x="24" y="14" width="16" height="40" fill="#ffd166"/><rect x="42" y="24" width="14" height="30" fill="#ff4d9e"/><rect x="28" y="22" width="4" height="6" fill="#0a0614"/><rect x="34" y="22" width="4" height="6" fill="#0a0614"/>',
house:'<polygon points="32,8 56,32 8,32" fill="#ff4d9e"/><rect x="16" y="32" width="32" height="22" fill="#ffd166"/><rect x="28" y="40" width="10" height="14" fill="#c44dff"/>',
star:'<polygon points="32,6 39,24 58,24 42,36 48,54 32,44 16,54 22,36 6,24 25,24" fill="#ffd166"/>',
compass:'<circle cx="32" cy="32" r="20" fill="none" stroke="#00f5d4" stroke-width="4"/><polygon points="32,8 37,32 32,27 27,32" fill="#ffd166"/><polygon points="32,56 27,32 32,37 37,32" fill="#ff4d9e"/>',
harbor:'<path d="M4 44c8 7 12-7 18 0s12-7 18 0 12-7 18 0v10H4z" fill="#00f5d4"/><polygon points="34,40 34,16 50,34" fill="#ff4d9e"/><rect x="32" y="14" width="3" height="30" fill="#f5f0ff"/><path d="M16 42h30l-4 8H20z" fill="#ffd166"/>'
};
let sound=true,projector=false,screenName="home",idx=0,open=false,city=null,page=0,help=false,note="",noteEn="";
let book=blankBook();
let audioCtx=null,suppressClick=false,scrollKey="";
const view=document.getElementById("view");
function blankBook(){return [[],[],[],[],[],[]];}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function icon(name){return '<svg class="pic" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#140a22"/>'+(PICS[name]||PICS.star)+"</svg>";}
function blip(){
  if(!sound)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine";o.frequency.setValueAtTime(640,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.045,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.09);
  }catch(e){}
}
function count(){return book.reduce((n,p)=>n+p.length,0);}
function pool(name){
  const d=CITIES[name];
  let rows=[
    ["ciao","Ciao! Io sono "+name+".","Hello! I am "+name+".","wave"],
    ["citta","Io sono una città italiana.","I am an Italian city.","city"],
    ["abito","Io abito in "+d.region+".","I live in "+d.region+".","house"],
    ["place","Io sono nel "+d.place+" d'Italia.","I am in the "+d.placeEn+" of Italy.","compass"],
    ["famosa","Io sono famosa.","I am famous.","star"],
    ["vmare","Io sono vicina al mare.","I am near the sea.","sea"],
    ["vmont","Io sono vicina alle montagne.","I am near the mountains.","mountains"],
    ["piazza","Io ho una piazza famosa.","I have a famous square.","square"],
    ["vedoM","Io vedo il mare.","I see the sea.","sea"],
    ["vedoG","Io vedo le montagne.","I see the mountains.","mountains"],
    ["storia","Io amo la mia storia.","I love my history.","story"],
    ["tuMare","Tu vedi il mare.","You see the sea.","sea"],
    ["pizza","Tu ami la pizza.","You love pizza.","pizza"],
    ["choc","Tu ami il cioccolato.","You love chocolate.","chocolate"],
    ["presto","A presto!","See you soon!","wave"]
  ];
  if(name==="Torino")rows=rows.filter(r=>!/mare/.test(r[1]));
  if(name==="Venezia")rows=rows.filter(r=>!/montagne/.test(r[1]));
  return rows.map(r=>({key:r[0],it:r[1],en:r[2],icon:r[3]}));
}
function pick(keys){
  const all=pool(city),map=Object.fromEntries(all.map(s=>[s.key,s])),out=[];
  keys.forEach(k=>{if(map[k])out.push(map[k]);});
  for(const s of all){if(out.length>=4)break;if(!out.some(x=>x.key===s.key))out.push(s);}
  return out.slice(0,4);
}
function chips(){
  if(page===1)return pick(["ciao","citta","abito","place"]);
  if(page===2)return pick(["famosa","vmare","vmont","piazza"]);
  if(page===3)return pick(["vedoM","vedoG","tuMare","piazza"]);
  if(page===4)return pick(city==="Napoli"?["pizza","storia","choc","famosa"]:["storia","pizza","choc","famosa"]);
  if(page===5)return pick(city==="Napoli"?["ciao","presto","pizza","storia"]:["ciao","presto","storia","choc"]);
  return [];
}
function btn(go,label,sub,cls,extra){
  return '<button type="button" class="btn '+cls+'" data-go="'+go+'" '+(extra||"")+"><b>"+label+"</b><small>"+sub+"</small></button>";
}
function dots(n,cur){
  let h="";
  for(let i=0;i<n;i++)h+='<i class="'+(i<cur?"on":"")+(i===cur?" now":"")+'"></i>';
  return '<div class="dots" aria-hidden="true">'+h+"</div>";
}
function viewHome(){
  return '<section class="stage home"><div class="avatar-frame hi"><img src="art/avatar/wave.png" alt="Teacher waving hello" draggable="false"></div><div class="pill">✦ Passaporto</div><h1>Aura Book</h1><p class="tagline">A passport of Italian sentences.</p>'+btn("start","Inizia","Start","teal")+"</section>";
}
function viewDeck(){
  const it=MODEL[idx][0],en=MODEL[idx][1],ic=MODEL[idx][2];
  const flap=open?'<div class="flap"><p class="en" lang="en">'+esc(en)+"</p></div>":"";
  return '<section class="stage"><div class="toprow"><span class="tag">Passaporto</span><span class="count">'+(idx+1)+" / "+MODEL.length+'</span></div>'+dots(MODEL.length,idx)+
    '<button type="button" class="postcard'+(open?" open":"")+'" id="card" data-go="flip" aria-expanded="'+open+'"><div class="seal">'+icon(ic)+'</div><h2 class="it-hero">'+esc(it)+"</h2>"+flap+'<span class="tap">'+(open?"Tap again to hide":"Tap the card for English")+"</span></button>"+
    '<p class="hint">One sentence. Tap for English.</p><div class="dock"><div class="nav">'+
    btn("prev","Indietro","Back","ghost")+
    btn("help","Aiuto","Show English","gold",'aria-pressed="'+open+'"')+
    btn("next","Avanti","Next","teal",'id="nextBtn"')+
    "</div></div></section>";
}
function viewCities(){
  const cards=Object.keys(CITIES).map(name=>{
    const d=CITIES[name];
    return '<button type="button" class="city" data-go="city" data-city="'+name+'"><span class="city-top">'+icon(d.icon)+'<span><strong class="cname">'+name+'</strong><span class="en" lang="en">'+esc(d.en)+"</span></span></span><span class=\"gossip\">"+esc(d.it)+'</span><span class="en" lang="en">'+esc(d.enFact)+'</span><span class="go">Fai questo libro<small>Make this book</small></span></button>';
  }).join("");
  return '<section class="stage"><div class="toprow"><span class="tag">Scegli la città</span></div><p class="hint">Tap a city. Then make its book.</p><div class="grow">'+cards+'</div><div class="dock"><div class="nav two">'+btn("prev","Indietro","Back","ghost")+btn("start","Frasi","Sentences","teal")+"</div></div></section>";
}
function viewBook(){
  const d=CITIES[city];
  const placed=book[page];
  let body;
  if(page===0){
    body='<div class="pass cover-block"><div class="pill">Passaporto</div>'+icon(d.icon)+'<div class="cityname">'+esc(city)+'</div><p class="en" lang="en">'+esc(d.en)+" · "+esc(d.region)+"</p></div>";
  }else{
    const lines=placed.map(s=>'<button type="button" class="placed" data-go="remove" data-key="'+s.key+'">'+icon(s.icon)+"<span><span class=\"line-it\">"+esc(s.it)+"</span>"+(help?'<span class="en" lang="en">'+esc(s.en)+"</span>":"")+"</span></button>").join("");
    const empty=placed.length?"":'<div class="wait"><div class="stamps3"><i class="ghost-stamp"></i><i class="ghost-stamp"></i><i class="ghost-stamp"></i></div><p class="ask">Tocca un adesivo</p><p class="en" lang="en">Tap a sticker</p></div>';
    const stick=chips().map(s=>{
      const on=placed.some(x=>x.key===s.key);
      return '<button type="button" class="sticker'+(on?" on":"")+'" data-go="add" data-key="'+s.key+'">'+icon(s.icon)+"<span><span class=\"it\">"+esc(s.it)+"</span>"+(help?'<span class="en" lang="en">'+esc(s.en)+"</span>":"")+"</span></button>";
    }).join("");
    body='<div class="pass">'+empty+lines+"</div>"+'<div class="stickers">'+stick+"</div>";
  }
  const goal=count()>=3?'<div class="pill good">Basta così · '+count()+"</div>":'<div class="pill">Adesivi '+count()+" / 3</div>";
  const doneBtn=count()>=3?btn("done","Vedi il passaporto","See your passport","gold"):"";
  const msg=note?'<p class="note" role="status">'+esc(note)+(noteEn?'<span class="en" lang="en">'+esc(noteEn)+"</span>":"")+"</p>":"";
  return '<section class="stage"><div class="toprow"><span class="tag">'+esc(PAGES[page])+'</span>'+goal+"</div>"+dots(PAGES.length,page)+'<p class="page-en" lang="en">'+esc(PAGE_EN[page])+"</p>"+
    '<div class="grow">'+body+"</div>"+'<div class="dock">'+msg+doneBtn+'<div class="nav">'+
    btn("prev","Indietro","Back","ghost")+
    btn("help","Aiuto","Show English","gold",'aria-pressed="'+help+'"')+
    btn("next","Avanti","Next","teal",'id="nextBtn"')+
    "</div></div></section>";
}
function viewDone(){
  const d=CITIES[city];
  const pages=[{name:"Cover",lines:[{it:city,en:d.en+" · "+d.region,icon:d.icon}]}];
  for(let i=1;i<PAGES.length;i++){if(book[i].length)pages.push({name:PAGES[i],lines:book[i]});}
  const list=pages.map(p=>'<article class="final"><h3>'+esc(p.name)+"</h3>"+p.lines.map(s=>'<p><span class="line-it">'+esc(s.it)+'</span><span class="en" lang="en">'+esc(s.en)+"</span></p>").join("")+"</article>").join("");
  return '<section class="stage"><div class="grow"><div class="home" style="justify-content:flex-start"><div class="avatar-frame party"><img src="art/avatar/celebrate.png" alt="Teacher celebrating" draggable="false"></div><div class="pill">Passaporto</div><h1 style="font-size:clamp(2rem,8vw,2.8rem)">Il tuo passaporto</h1><p class="tagline">'+esc(city)+"</p></div>"+list+"</div><div class=\"dock\">"+btn("again","Ricomincia","Start again","teal")+"</div></section>";
}
function render(){
  const key=screenName+":"+idx+":"+page+":"+city;
  const keep=key===scrollKey;
  const old=view.querySelector(".grow");
  const top=keep&&old?old.scrollTop:0;
  scrollKey=key;
  view.innerHTML=screenName==="home"?viewHome():screenName==="deck"?viewDeck():screenName==="cities"?viewCities():screenName==="book"?viewBook():viewDone();
  bindSwipe();
  const g=view.querySelector(".grow");
  if(g&&keep)g.scrollTop=top;
}
function start(){idx=0;open=false;city=null;page=0;help=false;note="";noteEn="";book=blankBook();screenName="deck";render();}
function again(){idx=0;open=false;city=null;page=0;help=false;note="";noteEn="";book=blankBook();screenName="home";render();}
function prev(){
  note="";noteEn="";
  if(screenName==="deck"){if(idx===0){screenName="home";render();return;}idx-=1;open=false;render();return;}
  if(screenName==="cities"){screenName="deck";open=false;render();return;}
  if(screenName==="book"){if(page===0){screenName="cities";render();return;}page-=1;render();}
}
function next(){
  note="";noteEn="";
  if(screenName==="deck"){if(idx>=MODEL.length-1){screenName="cities";render();return;}idx+=1;open=false;render();return;}
  if(screenName==="cities"){start();return;}
  if(screenName==="book"){if(page>=PAGES.length-1){finish();return;}page+=1;render();}
}
function finish(){
  if(count()<3){note="Tocca ancora un adesivo. Ne bastano 3.";noteEn="Tap one more sticker. 3 is enough.";render();return;}
  note="";noteEn="";screenName="done";render();
}
function choose(name){
  if(!CITIES[name])return;
  if(city!==name){city=name;book=blankBook();page=0;help=false;}
  note="";noteEn="";screenName="book";render();
}
function toggleChip(key){
  const item=chips().find(s=>s.key===key);
  if(!item)return;
  const at=book[page].findIndex(s=>s.key===key);
  if(at>=0)book[page].splice(at,1);else book[page].push(item);
  note="";noteEn="";render();
}
function bindSwipe(){
  const card=document.getElementById("card");
  if(!card)return;
  let x0=null,y0=null;
  card.addEventListener("touchstart",e=>{x0=e.changedTouches[0].clientX;y0=e.changedTouches[0].clientY;},{passive:true});
  card.addEventListener("touchend",e=>{
    if(x0==null)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    x0=y0=null;
    if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy))return;
    suppressClick=true;
    const dir=dx<0?1:-1;
    setTimeout(()=>{suppressClick=false;blip();if(dir<0)prev();else next();},40);
  },{passive:true});
}
view.addEventListener("click",e=>{
  if(suppressClick)return;
  const el=e.target.closest("[data-go]");
  if(!el||!view.contains(el))return;
  blip();
  const go=el.dataset.go;
  if(go==="flip"){open=!open;render();}
  else if(go==="start")start();
  else if(go==="prev")prev();
  else if(go==="next")next();
  else if(go==="help"){if(screenName==="deck")open=true;else help=!help;render();}
  else if(go==="city")choose(el.dataset.city);
  else if(go==="add"||go==="remove")toggleChip(el.dataset.key);
  else if(go==="done")finish();
  else if(go==="again")again();
});
document.getElementById("muteBtn").addEventListener("click",()=>{
  sound=!sound;
  const b=document.getElementById("muteBtn");
  b.textContent=sound?"🔊":"🔇";
  b.setAttribute("aria-pressed",String(!sound));
  b.setAttribute("aria-label",sound?"Mute sounds":"Unmute sounds");
  blip();
});
document.getElementById("projBtn").addEventListener("click",()=>{
  projector=!projector;
  document.body.classList.toggle("projector",projector);
  const b=document.getElementById("projBtn");
  b.setAttribute("aria-pressed",String(projector));
  blip();
});
render();
</script>
</body>
</html>
