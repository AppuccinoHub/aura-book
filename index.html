<style>
:root{--bg:#f6f1e6;--card:#fffaf2;--ink:#1c1915;--teal:#0f766e;--line:#e4d8c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.35}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#shell{width:min(100%,480px);height:100dvh;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--bg);overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{font-weight:900;font-size:1.15rem;color:var(--ink);letter-spacing:-.02em}
.controls{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--ink);font-weight:900;font-size:1.15rem;color:var(--ink);display:grid;place-items:center}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);border-width:3px;background:#efe6d4;color:var(--ink)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.home,.cities{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px 4px 12px}
.home{justify-content:center}
.hello{width:120px;height:68px;overflow:hidden;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.hello img{width:120px;height:auto;display:block;object-position:center top}
h1{font-size:clamp(2.6rem,11vw,3.4rem);line-height:1.15;font-weight:900;color:var(--ink);letter-spacing:-.03em;margin:0}
.tagline{font-size:1.2rem;font-weight:800;color:var(--ink);margin:0;max-width:20rem}
.teal{min-height:64px;width:min(100%,320px);border-radius:18px;padding:12px 16px;background:var(--teal);color:#fff;font-weight:900;font-size:1.45rem;border:2px solid var(--teal)}
.teal small{color:#fff;font-weight:800}
.city-list{width:100%;display:flex;flex-direction:column;gap:10px}
.city-btn{width:100%;min-height:72px;border-radius:20px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:1.7rem}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.route{flex:0 0 auto;position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:62px;margin:0 4px;padding:0 2px}
.route:before{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;background:var(--line);border-radius:99px}
.stop{position:relative;width:16px;height:16px;flex:0 0 auto;z-index:1}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);display:block}
.stop.done .dot{background:var(--teal);border-color:var(--teal)}
.stop.now .dot{background:var(--card);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.walker{position:absolute;left:50%;bottom:12px;width:64px;height:36px;transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:2}
.walker img{width:64px;height:auto;display:block}
.card{flex:1;min-height:0;width:100%;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;color:var(--ink)}
.card.open{border-color:var(--teal)}
.card img.shot{width:100%;height:min(34dvh,250px);object-fit:cover;border-radius:16px;border:2px solid var(--line);background:var(--bg);flex:0 0 auto}
.it{font-size:clamp(1.85rem,7.4vw,2.55rem);line-height:1.2;font-weight:900;color:var(--ink);margin:0}
.en{color:var(--teal);font-weight:800;font-size:clamp(1.05rem,4vw,1.28rem);line-height:1.35;margin:0}
.tap{font-weight:800;color:var(--ink);font-size:1rem;margin:0}
.dock{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.plain{min-height:56px;border-radius:18px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:1.15rem}
body.big .it{font-size:clamp(2.35rem,9vw,3.15rem)}
body.big .en{font-size:1.4rem}
body.big h1{font-size:3.5rem}
body.big .city-btn{font-size:2rem;min-height:84px}
@media (max-height:700px){
  .card img.shot{height:min(28dvh,190px)}
  .hello{width:96px;height:54px}
  h1{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

];
var view=document.getElementById("view");
var brand=document.getElementById("brand");
var muteBtn=document.getElementById("muteBtn");
var bigBtn=document.getElementById("bigBtn");
var muted=false, city=null, index=0, open=false;
function say(text){
  if(muted||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang="it-IT";
  window.speechSynthesis.speak(u);
}
function hush(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }
muteBtn.addEventListener("click",function(){
  muted=!muted;
  muteBtn.setAttribute("aria-pressed", muted?"true":"false");
  muteBtn.textContent=muted?"🔇":"🔊";
  muteBtn.setAttribute("aria-label", muted?"Unmute":"Mute");
  if(muted) hush();
});
bigBtn.addEventListener("click",function(){
  var on=document.body.classList.toggle("big");
  bigBtn.setAttribute("aria-pressed", on?"true":"false");
});
function home(){
  hush(); city=null; brand.textContent="Mi sono perso";
  view.innerHTML='<div class="home"><div class="hello"><img src="art/avatar/wave.png" alt=""></div><h1>Mi sono perso</h1><p class="tagline">Un messaggio a un amico.</p><button type="button" class="teal" id="start">Inizia</button></div>';
  document.getElementById("start").onclick=cities;
}
function cities(){
  hush(); city=null; brand.textContent="Mi sono perso";
  var html='<div class="cities"><h1>La città</h1><div class="city-list">';
  CITIES.forEach(function(c,i){ html+='<button type="button" class="city-btn" data-i="'+i+'">'+c.name+'</button>'; });
  html+='</div></div>';
  view.innerHTML=html;
  view.querySelectorAll(".city-btn").forEach(function(b){
    b.onclick=function(){ startCity(Number(b.getAttribute("data-i"))); };
  });
}
function startCity(i){ city=CITIES[i]; index=0; open=false; brand.textContent=city.name; render(); }
function render(){
  var stops=city.stops, s=stops[index];
  var dots="";
  for(var i=0;i<stops.length;i++){
    var cls=i<index?"done":(i===index?"now":"");
    dots+='<div class="stop '+cls+'">'+(i===index?'<div class="walker"><img src="art/avatar/wave.png" alt=""></div>':'')+'<i class="dot"></i></div>';
  }
  view.innerHTML=
    '<div class="stage">'+
    '<div class="route" aria-hidden="true">'+dots+'</div>'+
    '<button type="button" class="card'+(open?" open":"")+'" id="card" aria-expanded="'+(open?"true":"false")+'">'+
    '<img class="shot" src="'+s.img+'" alt="'+s.alt.replace(/"/g,"&quot;")+'">'+
    '<p class="it" lang="it">'+s.it+'</p>'+
    (open?'<p class="en" lang="en">'+s.en+'</p>':'<p class="tap">Tocca</p>')+
    '</button>'+
    '<div class="dock">'+
    '<button type="button" class="plain" id="back">'+(index===0?"Città":"Indietro")+'</button>'+
    '<button type="button" class="teal" id="next">'+(index===stops.length-1?"Città":"Avanti")+'</button>'+
    '</div></div>';
  document.getElementById("card").onclick=function(){ open=!open; render(); };
  document.getElementById("back").onclick=function(){ if(index===0) cities(); else { index--; open=false; render(); } };
  document.getElementById("next").onclick=goNext;
  var y0=null;
  view.ontouchstart=function(e){ y0=e.changedTouches[0].clientY; };
  view.ontouchend=function(e){
    if(y0==null) return;
    var dy=y0-e.changedTouches[0].clientY;
    y0=null;
    if(dy>56) goNext();
  };
  say(s.it);
}
function goNext(){
  if(index>=city.stops.length-1){ cities(); return; }
  index++; open=false; render();
}
home();
</script>
