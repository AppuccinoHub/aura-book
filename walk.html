<!doctype html>
<html lang="en">
<head>

<title>Da Boh a Lo So! · Le città</title>

<style>
:root{--bg:#f6f1e6;--card:#fffaf2;--ink:#1c1915;--teal:#0f766e;--line:#e4d8c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.35;font-style:normal}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#shell{position:fixed;top:0;left:0;right:0;width:min(100%,560px);height:100vh;height:100svh;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{font-weight:900;font-size:1.15rem}
.controls{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--ink);font-weight:900;font-size:1.15rem;display:grid;place-items:center}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);border-width:3px;background:#efe6d4}
#view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.progress{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.progress b{font-size:1rem;white-space:nowrap}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--line);border:0}
.dots i.done,.dots i.now{background:var(--teal)}
.scene{position:relative;flex:1;min-height:140px;border-radius:28px;overflow:hidden;border:2px solid var(--ink);background:#cbbfae}
.scene .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.scene .ground{position:absolute;left:16%;right:16%;bottom:3%;height:22px;border-radius:50%;background:rgba(28,25,21,.35);filter:blur(5px);z-index:1}
.scene .boh,.boh-hit{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:96%;width:94%;max-width:94%;z-index:2;filter:drop-shadow(0 12px 10px rgba(28,25,21,.28))}
.scene .boh{width:auto;height:auto;max-height:96%;max-width:94%;pointer-events:none;object-fit:contain;object-position:center bottom}
.boh-hit{padding:0;background:none;border:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.boh-hit img{max-height:100%;max-width:100%;width:auto;height:auto;display:block;pointer-events:none;object-fit:contain;object-position:center bottom}
.layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.bubble{flex:0 0 auto;position:relative;z-index:3;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px 12px 6px;text-align:center}
.bubble.speaking{border-color:var(--teal)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.speaking:after{border-color:transparent var(--teal) var(--teal) transparent}
.bubble .it{font-size:clamp(1.45rem,6vw,2.1rem)}
.cap{margin:2px 0 0;font-weight:800;font-size:1rem}
.panel{flex:0 1 auto;min-height:0;overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px;text-align:center}
.who{margin:0 auto 4px;display:inline-block;padding:2px 14px;border:2px solid var(--teal);border-radius:99px;font-weight:900;font-size:1.05rem}
.it{margin:0;font-weight:900;font-size:clamp(1.7rem,7vw,2.45rem);line-height:1.15}
.en{display:none;margin:2px 0 0;color:var(--teal);font-weight:800;font-size:clamp(1.05rem,3.8vw,1.25rem)}
.bubble:hover .en,.bubble:focus-within .en,.city:hover .en,body.show-en .en{display:block}
@keyframes walk-in{
  0%{transform:translateX(calc(-50% - 78px)) translateY(0) rotate(-3deg)}
  35%{transform:translateX(calc(-50% - 40px)) translateY(-10px) rotate(2deg)}
  65%{transform:translateX(calc(-50% - 16px)) translateY(0) rotate(-2deg)}
  100%{transform:translateX(-50%) translateY(0) rotate(0)}
}
@keyframes step{
  0%,100%{transform:translateX(calc(-50% - 6px)) translateY(0) rotate(-2.5deg)}
  50%{transform:translateX(calc(-50% + 6px)) translateY(-10px) rotate(2.5deg)}
}
.boh-hit.arrive,.scene .boh.arrive{animation:walk-in 1.05s ease-out both}
.boh-hit.stepping,.scene .boh.stepping{animation:step .68s ease-in-out infinite}
.field{width:min(100%,24rem);display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:800;font-size:1rem}
.field input{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--card);padding:8px 12px;font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink)}
.need{margin:0;font-weight:800;color:var(--ink)}
.cities{width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.city{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px;text-align:left;min-height:88px}
.city img{width:92px;height:72px;object-fit:cover;border-radius:12px}
.city b{display:block;font-size:1.35rem}
.teacher-link{font-weight:800;color:var(--teal);font-size:1rem}
.result{margin:8px 0 0;font-weight:800;font-size:1.05rem;min-height:1.3em}
.result.bene{color:var(--teal)}
.result.quasi,.result.again{color:var(--ink)}
.result.saved{color:var(--teal);font-size:1.55rem}
.flash{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;justify-content:center;padding:10px;pointer-events:none}
.flash div{background:var(--card);border:3px solid var(--teal);border-radius:18px;padding:8px 16px;text-align:center;box-shadow:0 6px 0 rgba(28,25,21,.16);animation:pop .28s ease-out both}
.flash b{font-size:2rem;font-weight:900;line-height:1;color:var(--teal)}
.flash small{margin-left:8px;font-weight:800;font-size:1.15rem;color:var(--ink)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.heard{font-weight:800}
.listen-tag{position:absolute;top:12px;left:12px;z-index:3;background:var(--card);border:2px solid var(--teal);border-radius:99px;padding:6px 12px;font-weight:900}
.dock{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 1.35fr;gap:8px}
.plain,.teal,.slim{min-height:58px;border-radius:18px;font-weight:900;font-size:1.2rem;border:2px solid var(--ink);background:var(--card);padding:8px 10px}
.plain.need-sound{border-color:var(--teal);border-width:3px;background:#efe6d4}
.verb{border-bottom:3px dotted var(--teal);color:var(--teal);cursor:help;position:relative}
button.verb{display:inline-block;padding:2px 4px;margin:0;min-height:44px;border:0;border-bottom:0;border-radius:8px;background:transparent;font-weight:900;font-size:inherit;line-height:1.1;vertical-align:baseline;color:var(--teal)}
button.verb .word{border-bottom:3px dotted var(--teal)}
.verb .tip,.choice .tip{display:none}
.verb .tip{margin-left:4px}
.verb:hover .tip,.verb:focus .tip,.verb.open .tip,.bubble:hover .verb .tip,.bubble:focus-within .verb .tip,body.show-en .verb .tip{display:inline}
.choice .tip{display:none;color:var(--teal);font-size:1rem}
.choice:hover .tip,.choice:focus .tip,.choice.open .tip,body.show-en .choice .tip{display:block}
.blank{display:inline-block;min-width:4.6rem;border-bottom:3px solid var(--ink);transform:translateY(-2px)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:100%}
.choice{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-weight:900;font-size:1.12rem;padding:8px 12px;text-align:left}
.help-btn{width:100%;margin-top:8px}
.choice.good{border-color:var(--teal);background:#e7f3f1;color:var(--teal)}
.choice.bad{opacity:.45}
.choice:disabled{cursor:default}
.help-box{margin:8px 0 0;font-weight:800;color:var(--teal);font-size:1.05rem}
.solved{margin:4px 0 0;font-weight:800;color:var(--teal);font-size:1.2rem}
.teal{background:var(--teal);border-color:var(--teal);color:#fff;font-size:1.35rem}
.slim{min-height:48px;font-size:1.05rem}
.teal[disabled],.plain[disabled]{opacity:.55}
.start,.done{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 2px 4px}
.start{overflow:auto}
.start .scene{flex:0 0 auto;width:100%;height:min(34dvh,260px)}
.done .scene{flex:0 0 auto;width:100%;height:min(32dvh,280px)}
.city .hook{display:block;font-weight:800;font-size:1.05rem}
.done .book{flex:1;min-height:0;overflow:auto;width:min(100%,24rem)}
h1{margin:0;font-size:clamp(2rem,8vw,2.7rem);line-height:1.1;font-weight:900}
.lead{margin:0;font-weight:800;font-size:1.15rem;max-width:24rem}
.steps{margin:0;padding:0;list-style:none;width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.steps li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:1.08rem;text-align:left}
.book{margin:0;padding:0;list-style:none;width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.book li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-weight:900;font-size:1.15rem}
.book small{display:block;color:var(--teal);font-weight:800;font-size:.95rem}
.start .teal,.done .teal{width:min(100%,320px);flex:0 0 auto}
body.big .it{font-size:clamp(2.05rem,8.4vw,2.9rem)}
body.big .en{font-size:1.35rem}
body.big .choice{font-size:1.3rem}
body.big .who{font-size:1.2rem}
@media (min-width:800px){
  #shell{width:min(100%,1120px)}
  .it{font-size:clamp(2rem,4vw,2.8rem)}
  .bubble .it{font-size:clamp(1.8rem,3vw,2.4rem)}
  .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,400px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"photo words" "photo check" "photo buttons";gap:12px;align-items:stretch}
  .bubble{grid-area:words}
  .bubble:after{display:none}
  .scene{grid-area:photo;min-height:0;height:100%}
  .panel{grid-area:check;align-self:stretch;overflow:auto;min-height:0;max-height:none}
  .dock{grid-area:buttons}
  .scene .boh,.boh-hit{height:96%}
}
@media (max-height:700px){
  .start .scene,.done .scene{height:min(26dvh,180px)}
  .panel{padding:8px 10px}
  .plain,.teal,.choice{min-height:48px}
  .choice{font-size:1.05rem}
}
@media (max-width:799px){
  .panel{max-height:40dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  {who:"tu", whoEn:"you", it:"Tu sei a Torino?", en:"Are you in Turin?", verb:"sei", before:"Tu ", after:" a Torino?", img:"art/cities/torino-via-roma.jpg", alt:"Via Roma, a main street in Turin.", pose:"art/avatar/boh-wave.png", say:"art/voice/torino-sei.mp3"},
  {who:"io", whoEn:"I", it:"Io vado a Torino.", en:"I go to Turin.", verb:"vado", before:"Io ", after:" a Torino.", img:"art/cities/torino-piazza-castello.jpg", alt:"Piazza Castello in Turin.", pose:"art/avatar/boh-walk.png", say:"art/voice/torino-vado.mp3"},
  {who:"tu", whoEn:"you", it:"Tu vai a Torino?", en:"Do you go to Turin?", verb:"vai", before:"Tu ", after:" a Torino?", img:"art/cities/torino-piazza-san-carlo.jpg", alt:"Piazza San Carlo in Turin.", pose:"art/avatar/boh-wave.png", say:"art/voice/torino-vai.mp3"}
]}
];
var view=document.getElementById("view"), muted=false;
var ci=-1, mode="fact", fi=0, round=0, i=0;
var mark="", helped=false, locked=false, arrive=false;
var studentName="", classCode="", sid="", conn=null, peer=null, linked=false, showEn=false;
var log={};
try{ log=JSON.parse(sessionStorage.getItem("auraLog2")||"{}")||{}; }catch(e){ log={}; }
sid=sessionStorage.getItem("auraSid")||"";
if(!sid){ sid=Math.random().toString(36).slice(2,8); sessionStorage.setItem("auraSid", sid); }
showEn=sessionStorage.getItem("auraEn")==="1";
var player=document.getElementById("bohVoice");
var playToken=0;
function item(){
  var c=CITIES[ci];
  return mode==="fact"?c.facts[fi]:c.lines[i];
}
function roundLabel(){ return mode==="fact"?"About the city":ROUNDS[round].name; }
function keyNow(){ return mode==="fact"?"fact-"+fi:ROUNDS[round].id+"-"+i; }
function rank(m){ return {bene:3,help:2,quasi:2,saved:2,again:1,missed:1,started:0}[m]||0; }
function findRow(){
  if(ci<0) return null;
  var rows=log[CITIES[ci].id]||[], key=keyNow(), n;
  for(n=0;n<rows.length;n++) if(rows[n]&&rows[n].key===key) return rows[n];
  return null;
}
function say(src){
  if(!src) return;
  var cap=document.getElementById("cap");
  var hear=document.getElementById("hear");
  if(muted){
    if(cap) cap.textContent="Sound is off. Tap the speaker.";
    return;
  }
  var mine=++playToken;
  try{ player.pause(); }catch(e){}
  if(player.getAttribute("data-src")!==src){
    player.src=src;
    player.setAttribute("data-src", src);
  }
  try{ player.currentTime=0; }catch(e){}
  var run=player.play();
  if(run&&run.then) run.then(function(){
    if(mine!==playToken) return;
    if(hear&&hear.isConnected){ hear.textContent="Hear Boh"; hear.classList.remove("need-sound"); }
  });
  if(run&&run.catch) run.catch(function(){
    if(mine!==playToken) return;
    if(cap&&cap.isConnected) cap.textContent="Tap Hear Boh to listen.";
    if(hear&&hear.isConnected){ hear.textContent="Tap to hear"; hear.classList.add("need-sound"); }
  });
}
function hush(){ try{ player.pause(); }catch(e){} }
function playLine(){
  if(ci<0) return;
  var bub=document.getElementById("bubble");
  player.onended=null;
  if(bub) bub.classList.add("speaking");
  say(item().say);
  if(muted){ if(bub) bub.classList.remove("speaking"); return; }
  player.onended=function(){
    if(bub&&bub.isConnected) bub.classList.remove("speaking");
  };
}
function poseNow(){
  if(arrive) return "art/avatar/boh-walk.png";
  if(locked) return "art/avatar/boh-ok.png";
  return item().pose||"art/avatar/boh-walk.png";
}
function motionClass(pose){
  if(arrive) return "arrive";
  if(!locked && /boh-walk/.test(pose||"")) return "stepping";
  return "";
}
function readyCount(c){
  var rows=log[c.id]||[], n=0, k;
  for(k=0;k<rows.length;k++) if(rows[k]&&(rows[k].mark==="bene"||rows[k].mark==="help")) n++;
  return n;
}
function remember(kind){
  if(ci<0) return;
  var c=CITIES[ci], it=item(), key=keyNow(), next=kind||"started";
  if(!log[c.id]) log[c.id]=[];
  var rows=log[c.id], row=null, n;
  for(n=0;n<rows.length;n++) if(rows[n]&&rows[n].key===key){ row=rows[n]; break; }
  if(row && rank(row.mark)>rank(next)) next=row.mark;
  var rec={key:key, it:it.it, en:it.en, mark:next, round:roundLabel(), heard:""};
  if(row) rows[n]=rec; else rows.push(rec);
  try{ sessionStorage.setItem("auraLog2", JSON.stringify(log)); }catch(e){}
  sendTeacher();
}
function packLog(){
  try{ return "WALK1."+btoa(unescape(encodeURIComponent(JSON.stringify({name:studentName||"Student", stops:log})))); }
  catch(e){ return ""; }
}
function teacherId(code){ return "aurawalk-"+String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function sendTeacher(){
  if(!conn||!conn.open) return;
  try{ conn.send({type:"update", id:sid, name:studentName||"Student", stops:log}); }catch(e){}
}
function connectTeacher(){
  if(!window.Peer||!classCode||!studentName) return;
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=new Peer(teacherId(classCode)+"-s-"+sid, {debug:0});
  peer.on("open", function(){
    conn=peer.connect(teacherId(classCode));
    conn.on("open", function(){ linked=true; sendTeacher(); });
    conn.on("close", function(){ linked=false; });
  });
  peer.on("error", function(){ linked=false; });
}
document.getElementById("muteBtn").onclick=function(){
  muted=!muted; this.setAttribute("aria-pressed", muted?"true":"false"); this.textContent=muted?"🔇":"🔊";
  this.setAttribute("aria-label", muted?"Unmute":"Mute"); if(muted) hush();
};
document.getElementById("bigBtn").onclick=function(){
  this.setAttribute("aria-pressed", document.body.classList.toggle("big"));
};
function applyEn(){
  document.body.classList.toggle("show-en", showEn);
  var b=document.getElementById("engBtn");
  if(!b) return;
  b.setAttribute("aria-pressed", showEn?"true":"false");
  b.setAttribute("aria-label", showEn?"Hide English":"Show English");
}
document.getElementById("engBtn").onclick=function(){
  showEn=!showEn;
  try{ sessionStorage.setItem("auraEn", showEn?"1":"0"); }catch(e){}
  applyEn();
};
applyEn();
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function cheerHtml(){
  if(!locked) return "";
  var small=mark==="help"?"You used help.":"Lo so!";
  return '<div class="flash" role="status"><div><b>Bene!</b><small>'+small+'</small></div></div>';
}
function sceneHtml(img, alt, pose, tappable, motion, flash){
  var cls=motion||"";
  var fig=tappable
    ? '<button type="button" class="boh-hit '+cls+'" id="bohBtn" aria-label="Hear Boh"><img src="'+pose+'" alt=""></button>'
    : '<img class="boh '+cls+'" src="'+pose+'" alt="">';
  return '<div class="scene"><img class="shot" src="'+img+'" alt="'+esc(alt)+'">'+
    '<div class="ground"></div>'+fig+(flash||"")+'</div>';
}
function showCheer(){
  var scene=document.querySelector(".layout .scene")||document.querySelector(".scene");
  if(scene && !scene.querySelector(".flash")){
    var wrap=document.createElement("div");
    wrap.innerHTML=cheerHtml();
    if(wrap.firstChild) scene.appendChild(wrap.firstChild);
  }
  player.onended=null;
  say("art/voice/bene.mp3");
}
function armWalk(el){
  if(!el) return;
  el.addEventListener("animationend", function(ev){
    if(ev.animationName!=="walk-in"||!arrive||!el.isConnected) return;
    arrive=false;
    var pose=poseNow();
    var img=el.querySelector("img")||el;
    img.src=pose;
    el.classList.remove("arrive");
    if(motionClass(pose)==="stepping") el.classList.add("stepping");
  });
}
function wordButton(word, tip){
  return '<button type="button" class="verb" id="gloss"><span class="word">'+esc(word)+'</span><span class="tip">('+esc(tip)+')</span></button>';
}
function factHtml(f){
  var at=f.it.indexOf(f.word);
  if(at<0) return esc(f.it);
  return esc(f.it.slice(0,at))+wordButton(f.word, f.gloss)+esc(f.it.slice(at+f.word.length));
}
function lineHtml(line, blank){
  if(blank) return esc(line.before)+'<span class="blank" aria-hidden="true"></span>'+esc(line.after);
  return esc(line.before)+wordButton(line.verb, VERB_EN[line.verb]||"")+esc(line.after);
}
function sentenceHtml(){
  var it=item();
  if(mode==="fact") return factHtml(it);
  if(round===1) return "Ascolta.";
  if(round>=2) return lineHtml(it, true);
  return lineHtml(it, false);
}
function captionText(){
  if(locked) return mark==="help"?"Bene! You used help.":"Bene!";
  if(mode==="fact") return "Rest on the new word. Pick the English.";
  if(round===0) return "Rest on the verb. Pick the English.";
  if(round===1) return "Listen. Pick the Italian.";
  if(round===2) return "Pick the verb. Rest on a word to see English.";
  return "Fill in the verb. Tap Help if you need it.";
}
function rndSeed(seed){
  var s=seed>>>0;
  return function(){
    s=(Math.imul(1664525, s)+1013904223)>>>0;
    return s/4294967296;
  };
}
function pick3(correct, pool, seed){
  var opts=[correct], seen={}, n, w, rnd=rndSeed(seed), j, t;
  seen[correct]=1;
  for(n=0;n<pool.length&&opts.length<3;n++){
    w=pool[n];
    if(!w||seen[w]) continue;
    seen[w]=1;
    opts.push(w);
  }
  for(n=opts.length-1;n>0;n--){
    j=Math.floor(rnd()*(n+1));
    t=opts[n]; opts[n]=opts[j]; opts[j]=t;
  }
  return opts;
}
function seedNow(){
  var part=mode==="fact"?fi:((round+1)*10+i);
  return ((ci+1)*100+part+3)>>>0;
}
function factPool(en){
  var pool=[], n, c;
  var mine=CITIES[ci].facts;
  for(n=0;n<mine.length;n++) if(mine[n].en!==en) pool.push(mine[n].en);
  for(c=0;c<CITIES.length;c++){
    if(c===ci) continue;
    for(n=0;n<CITIES[c].facts.length;n++) pool.push(CITIES[c].facts[n].en);
  }
  return pool;
}
function linePool(field){
  var pool=[], lines=CITIES[ci].lines, n, cur=item()[field];
  for(n=0;n<lines.length;n++) if(lines[n][field]!==cur) pool.push(lines[n][field]);
  return pool;
}
function verbPool(verb){
  var pool=(NEAR[verb]||[]).slice(), lines=CITIES[ci].lines, n;
  for(n=0;n<lines.length;n++) pool.push(lines[n].verb);
  for(n=0;n<EXTRA.length;n++) pool.push(EXTRA[n]);
  return pool;
}
function choiceKind(){
  if(mode==="fact"||round===0) return "en";
  if(round===1) return "it";
  return "verb";
}
function correctPick(){
  var it=item(), kind=choiceKind();
  if(kind==="en") return it.en;
  if(kind==="it") return it.it;
  return it.verb;
}
function choicePool(){
  var it=item(), kind=choiceKind();
  if(kind==="verb") return verbPool(it.verb);
  if(kind==="it") return linePool("it");
  if(mode==="fact") return factPool(it.en);
  return linePool("en");
}
function choicesHtml(){
  var kind=choiceKind(), correct=correctPick(), opts=pick3(correct, choicePool(), seedNow());
  var html='<div class="choices" role="group">', n, o, tip, cls;
  for(n=0;n<opts.length;n++){
    o=opts[n];
    tip=kind==="verb"?'<span class="tip">('+esc(VERB_EN[o]||"")+")</span>":"";
    cls="choice"+(locked&&o===correct?" good":"");
    html+='<button type="button" class="'+cls+'" data-pick="'+esc(o)+'"'+(kind==="en"?' lang="en"':' lang="it"')+(locked?" disabled":"")+">"+esc(o)+tip+"</button>";
  }
  html+="</div>";
  html+=locked
    ? '<p class="solved" id="solved" lang="en">'+esc(item().en)+"</p>"
    : '<p class="solved" id="solved" lang="en" hidden></p>';
  return html;
}
function helpHtml(){
  if(!(mode==="round"&&round===3&&!locked)) return "";
  return '<button type="button" class="plain help-btn" id="helpBtn">Help</button><p class="help-box" id="helpBox" hidden></p>';
}
function whoHtml(){
  var it=item();
  if(mode==="fact") return '<p class="who">new word</p>';
  return '<p class="who" lang="it">'+esc(it.who)+' = <span lang="en">'+esc(it.whoEn)+"</span></p>";
}
function showHelp(){
  helped=true;
  var box=document.getElementById("helpBox"), it=item();
  if(!box) return;
  box.hidden=false;
  box.textContent=it.en+" "+it.verb+" = "+(VERB_EN[it.verb]||"");
}
function bindChoices(){
  var buttons=view.querySelectorAll(".choice");
  buttons.forEach(function(btn){
    btn.onclick=function(){
      if(locked||btn.disabled) return;
      if(btn.getAttribute("data-pick")===correctPick()){
        locked=true;
        mark=helped?"help":"bene";
        btn.classList.add("good");
        buttons.forEach(function(b){ b.disabled=true; });
        var solved=document.getElementById("solved");
        if(solved){ solved.hidden=false; solved.textContent=item().en; }
        var cap=document.getElementById("cap");
        if(cap) cap.textContent=mark==="help"?"Bene! You used help.":"Bene! Lo so!";
        var hit=document.getElementById("bohBtn");
        if(hit){
          hit.classList.remove("arrive","stepping");
          var img=hit.querySelector("img");
          if(img) img.src="art/avatar/boh-ok.png";
        }
        var help=document.getElementById("helpBtn");
        if(help) help.disabled=true;
        showCheer();
        remember(mark);
      } else {
        btn.classList.add("bad");
        btn.disabled=true;
        var miss=document.getElementById("cap");
        if(miss) miss.textContent="Try another.";
        var who=document.getElementById("bohBtn");
        if(who){
          who.classList.remove("arrive","stepping");
          var face=who.querySelector("img");
          if(face) face.src="art/avatar/boh-huh.png";
        }
        remember("again");
      }
    };
  });
}
function paint(){
  var c=CITIES[ci];
  var total=mode==="fact"?c.facts.length:c.lines.length;
  var idx=mode==="fact"?fi:i;
  var dots="", k, pose=poseNow();
  for(k=0;k<total;k++) dots+='<i class="'+(k<idx?"done":k===idx?"now":"")+'"></i>';
  var label=roundLabel()+" · "+(idx+1)+" / "+total;
  var backLabel=(mode==="fact"&&fi===0)?"Cities":"Back";
  var nextLabel=(mode==="round"&&round===ROUNDS.length-1&&i===c.lines.length-1)?"Finish":"Next";
  view.innerHTML=
    '<div class="progress" aria-label="'+esc(label)+'"><b>'+esc(label)+'</b><div class="dots" aria-hidden="true">'+dots+'</div></div>'+
    '<div class="layout">'+
    '<div class="bubble" id="bubble"><p class="it" lang="it">'+sentenceHtml()+'</p><p class="cap" id="cap" aria-live="polite">'+esc(captionText())+"</p></div>"+
    sceneHtml(item().img, item().alt, pose, true, motionClass(pose), cheerHtml())+
    '<div class="panel">'+whoHtml()+choicesHtml()+helpHtml()+"</div>"+
    '<div class="dock">'+
    '<button type="button" class="teal" id="next">'+nextLabel+"</button>"+
    '<div class="row">'+
    '<button type="button" class="plain" id="hear">Hear Boh</button>'+
    '<button type="button" class="plain" id="back">'+backLabel+"</button>"+
    "</div></div></div>";
  armWalk(document.getElementById("bohBtn"));
  document.getElementById("bohBtn").onclick=playLine;
  document.getElementById("hear").onclick=playLine;
  document.getElementById("back").onclick=goBack;
  document.getElementById("next").onclick=function(){
    if(!locked) remember("again");
    goNext();
  };
  var g=document.getElementById("gloss");
  if(g) g.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); g.classList.add("open"); };
  var bub=document.getElementById("bubble");
  if(g&&bub) bub.addEventListener("click", function(){ g.classList.add("open"); });
  var help=document.getElementById("helpBtn");
  if(help) help.onclick=showHelp;
  bindChoices();
  fitShell();
  window.scrollTo(0,0);
}
function openCard(walkIn){
  hush();
  var prev=findRow();
  if(prev && (prev.mark==="bene"||prev.mark==="help")){
    locked=true; mark=prev.mark; helped=(prev.mark==="help");
  } else {
    locked=false; mark=""; helped=false;
  }
  arrive=!!walkIn && !locked;
  paint();
  remember(locked?mark:"started");
  playLine();
}
function goNext(){
  var c=CITIES[ci];
  if(mode==="fact"){
    if(fi<c.facts.length-1){ fi++; openCard(false); }
    else { mode="round"; round=0; i=0; openCard(false); }
    return;
  }
  if(i<c.lines.length-1){ i++; openCard(false); return; }
  if(round<ROUNDS.length-1){ round++; i=0; openCard(false); return; }
  done();
}
function goBack(){
  var c=CITIES[ci];
  if(mode==="fact"){
    if(fi===0){ cities(); return; }
    fi--; openCard(false); return;
  }
  if(i>0){ i--; openCard(false); return; }
  if(round>0){ round--; i=c.lines.length-1; openCard(false); return; }
  mode="fact"; fi=c.facts.length-1; openCard(false);
}
function enterCities(){
  studentName=(document.getElementById("name").value||"").trim();
  classCode=(document.getElementById("code").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(classCode && !studentName){ document.getElementById("need").hidden=false; return; }
  try{
    sessionStorage.setItem("auraName", studentName);
    sessionStorage.setItem("auraCode", classCode);
  }catch(e){}
  if(classCode && studentName) connectTeacher();
  cities();
}
function start(){
  hush(); ci=-1;
  var savedName="", savedCode="";
  try{
    savedName=sessionStorage.getItem("auraName")||"";
    savedCode=(new URLSearchParams(location.search).get("code")||sessionStorage.getItem("auraCode")||"").toUpperCase();
  }catch(e){}
  view.innerHTML=
    '<div class="start">'+
    sceneHtml("art/cities/roma-colosseo.jpg","The Colosseum in Rome.","art/avatar/boh-wave.png",true,"")+
    "<h1>Da Boh a Lo So!</h1>"+
    '<p class="lead">Boh walks a city. You listen and tap. Next is always there.</p>'+
    '<label class="field">First name<input id="name" autocomplete="given-name" maxlength="24" value="'+esc(savedName)+'"></label>'+
    '<label class="field">Class code<input id="code" maxlength="6" autocapitalize="characters" value="'+esc(savedCode)+'" placeholder="From your teacher"></label>'+
    '<p class="need" id="need" hidden>Type your first name so your teacher can see you.</p>'+
    '<button type="button" class="teal" id="go">Pick a city</button>'+
    '<a class="teacher-link" href="teacher.html">Teacher page</a></div>';
  document.getElementById("go").onclick=enterCities;
  var hello=document.getElementById("bohBtn");
  if(hello) hello.onclick=enterCities;
}
function cities(){
  hush(); ci=-1;
  var cards="", n, c, got, need;
  for(n=0;n<CITIES.length;n++){
    c=CITIES[n]; got=readyCount(c); need=c.facts.length+c.lines.length*ROUNDS.length;
    cards+='<button type="button" class="city" data-n="'+n+'"><img src="'+c.cover+'" alt="">'+
      '<span><b lang="it">'+c.name+'</b><span class="en">'+esc(c.en)+"</span>"+
      '<span class="hook" lang="it">'+esc(c.hook)+"</span>"+
      '<span class="en">'+esc(c.hookEn)+"</span>"+
      (got?'<span class="cap">'+got+"/"+need+" ready</span>":"")+"</span></button>";
  }
  view.innerHTML='<div class="start"><h1>Where is Boh?</h1><p class="lead">Pick one city. That is enough for today.</p><div class="cities">'+cards+"</div></div>";
  view.querySelectorAll(".city").forEach(function(btn){
    btn.onclick=function(){
      ci=+btn.getAttribute("data-n");
      mode="fact"; fi=0; round=0; i=0;
      openCard(true);
    };
  });
}
function done(){
  hush(); arrive=false;
  var c=CITIES[ci], lines="", k;
  for(k=0;k<c.facts.length;k++) lines+='<li lang="it">'+esc(c.facts[k].it)+"<small>"+esc(c.facts[k].en)+"</small></li>";
  for(k=0;k<c.lines.length;k++) lines+='<li lang="it">'+esc(c.lines[k].it)+"<small>"+esc(c.lines[k].en)+"</small></li>";
  var note=linked?"Your teacher can see this.":(classCode?"The teacher page did not connect. Copy this and paste it on the teacher page.":"Next time, use a class code from the teacher page.");
  view.innerHTML=
    '<div class="done">'+
    sceneHtml(c.cover, c.name, "art/avatar/boh-kiss.png", false, "")+
    "<h1>Lo so!</h1>"+
    '<p class="lead" lang="it">'+esc(c.name)+"</p>"+
    '<p class="lead">Write one of these sentences in the town book. '+esc(note)+"</p>"+
    '<ul class="book">'+lines+"</ul>"+
    (linked?"":'<button type="button" class="plain" id="copy">Copy for teacher</button>')+
    '<button type="button" class="teal" id="again">All cities</button></div>';
  say("art/voice/loso.mp3");
  var copy=document.getElementById("copy");
  if(copy) copy.onclick=function(){
    var text=packLog();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function(){});
    copy.textContent="Copied";
  };
  document.getElementById("again").onclick=cities;
}
function fitShell(){
  var shell=document.getElementById("shell");
  if(!shell) return;
  var vv=window.visualViewport;
  var h=vv?vv.height:window.innerHeight;
  var top=vv?vv.offsetTop:0;
  shell.style.height=Math.max(320, Math.round(h))+"px";
  shell.style.top=Math.round(top)+"px";
}
fitShell();
window.addEventListener("resize", fitShell);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitShell);
  window.visualViewport.addEventListener("scroll", fitShell);
}
start();
</script>
