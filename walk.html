<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e6">
<title>Da Boh a Lo So! · Passeggiata a Napoli</title>
<!-- Sea: Paolo Villa, CC BY-SA 4.0. Vesuvius: PaestumPaestum, CC BY-SA 4.0. Piazza: Giorgio Visco, CC BY-SA 4.0. Wikimedia Commons. -->
<style>
:root{--bg:#f6f1e6;--card:#fffaf2;--ink:#1c1915;--teal:#0f766e;--line:#e4d8c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.35;font-style:normal}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#shell{width:min(100%,520px);height:100dvh;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{font-weight:900;font-size:1.15rem}
.controls{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--ink);font-weight:900;font-size:1.15rem;display:grid;place-items:center}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);border-width:3px;background:#efe6d4}
#view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.route{flex:0 0 auto;position:relative;height:118px;margin:0 8px}
.route:before{content:"";position:absolute;left:0;right:0;bottom:8px;height:4px;background:var(--line);border-radius:99px}
.stop{position:absolute;bottom:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.stop.done{background:var(--teal);border-color:var(--teal)}
.stop.now{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal);background:var(--card)}
.bot{position:absolute;bottom:10px;width:72px;height:104px;margin-left:-36px;transition:left .7s ease;pointer-events:none}
.bot img{width:100%;height:100%;object-fit:contain;display:block}
.card{flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;overflow:hidden}
.card img.shot{width:100%;height:min(32dvh,260px);object-fit:cover;border-radius:16px;border:2px solid var(--line);flex:0 0 auto}
.who{margin:0;padding:2px 14px;border:2px solid var(--teal);border-radius:99px;font-weight:900;font-size:1.05rem;color:var(--ink)}
.it{margin:0;font-weight:900;font-size:clamp(1.9rem,7.6vw,2.6rem);line-height:1.2}
.en{margin:0;color:var(--teal);font-weight:800;font-size:clamp(1.1rem,4.2vw,1.35rem)}
.dock{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.plain,.teal{min-height:60px;border-radius:18px;font-weight:900;font-size:1.25rem;border:2px solid var(--ink);background:var(--card);padding:10px}
.teal{background:var(--teal);border-color:var(--teal);color:#fff;font-size:1.4rem}
.start{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:4px 2px 12px}
.start img{height:min(26dvh,190px);width:auto;flex:0 0 auto}
h1{margin:0;font-size:clamp(2.1rem,8vw,2.8rem);line-height:1.15;font-weight:900}
.lead{margin:0;font-weight:800;font-size:1.2rem;color:var(--ink);max-width:22rem}
.steps{margin:0;padding:0;list-style:none;width:min(100%,22rem);display:flex;flex-direction:column;gap:8px}
.steps li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:1.15rem;color:var(--ink)}
.start .teal{width:min(100%,320px);flex:0 0 auto}
body.big .it{font-size:clamp(2.3rem,9vw,3.2rem)}
body.big .en{font-size:1.5rem}
body.big .who{font-size:1.25rem}
@media (max-height:700px){.card img.shot{height:min(26dvh,180px)}.route{height:96px}.bot{height:84px;width:58px;margin-left:-29px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="shell">
<header>
  <div class="brand">Da Boh a Lo So!</div>
  <div class="controls">
    <button type="button" class="icon-btn" id="muteBtn" aria-label="Mute" aria-pressed="false">🔊</button>
    <button type="button" class="icon-btn" id="bigBtn" aria-label="Bigger text" aria-pressed="false">Aa</button>
  </div>
</header>
<div id="view"></div>
</div>
<script>
var STOPS=[
{who:"io",whoEn:"I",it:"Io sono a Napoli.",en:"I am in Naples.",img:"art/cities/napoli-castel-ovo.jpg",alt:"Castel dell'Ovo on the Gulf of Naples, in the sun.",pose:"art/avatar/boh-walk.png",say:"art/voice/sono.mp3"},
{who:"io",whoEn:"I",it:"Io vedo il mare.",en:"I see the sea.",img:"art/cities/napoli-mare.jpg",alt:"The Gulf of Naples in bright sun, blue water from the rocks at Posillipo.",pose:"art/avatar/boh-point.png",say:"art/voice/mare.mp3"},
{who:"io",whoEn:"I",it:"Io vedo il Vesuvio.",en:"I see Vesuvius.",img:"art/cities/napoli-vesuvio-bay.jpg",alt:"Mount Vesuvius across the blue bay of Naples, in clear daylight.",pose:"art/avatar/boh-point.png",say:"art/voice/vesuvio.mp3"},
{who:"io",whoEn:"I",it:"Io vedo la piazza.",en:"I see the town square.",img:"art/cities/napoli-piazza.jpg",alt:"Piazza del Plebiscito in Naples on a sunny day, with people in the square.",pose:"art/avatar/boh-point.png",say:"art/voice/piazza.mp3"},
{who:"io",whoEn:"I",it:"Io ho una pizza Margherita.",en:"I have a Margherita pizza.",img:"art/cities/napoli-pizza-margherita.jpg",alt:"A Margherita pizza with tomato, mozzarella, and basil.",pose:"art/avatar/boh-shrug.png",say:"art/voice/ho.mp3"},
{who:"io",whoEn:"I",it:"Io mangio la pizza.",en:"I eat the pizza.",img:"art/cities/napoli-pizza-margherita-2.jpg",alt:"A Margherita pizza with tomato, mozzarella, and basil.",pose:"art/avatar/boh-pizza.png",say:"art/voice/mangio.mp3"},
{who:"tu",whoEn:"you",it:"Tu visiti Napoli. A presto!",en:"You visit Naples. See you soon!",img:"art/cities/napoli-castel-ovo.jpg",alt:"Castel dell'Ovo on the Gulf of Naples, in the sun.",pose:"art/avatar/boh-kiss.png",say:"art/voice/tu.mp3"}
];
var view=document.getElementById("view"), muted=false, i=-1, voice=null;
function say(src){
  hush();
  if(muted||!src) return;
  voice=new Audio(src);
  voice.play().catch(function(){});
}
function hush(){ if(voice){ voice.pause(); voice=null; } }
document.getElementById("muteBtn").onclick=function(){
  muted=!muted; this.setAttribute("aria-pressed",muted); this.textContent=muted?"🔇":"🔊";
  this.setAttribute("aria-label",muted?"Unmute":"Mute"); if(muted) hush();
};
document.getElementById("bigBtn").onclick=function(){
  this.setAttribute("aria-pressed",document.body.classList.toggle("big"));
};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function pct(k){ return (4+k*(92/(STOPS.length-1)))+"%"; }
function start(){
  hush(); i=-1;
  view.innerHTML='<div class="start"><img src="art/avatar/boh-wave.png" alt="">'+
    '<h1>Da Boh a Lo So!</h1>'+
    '<p class="en">From "I don\'t know" to "I know."</p>'+
    '<p class="lead">Boh walks through Napoli. At each stop she says one easy sentence, the same kind you use in your town book.</p>'+
    '<ul class="steps">'+
    '<li lang="it">Io sono. Io vedo. Io ho. Io mangio.</li>'+
    '<li>Then one <span lang="it">Tu</span> sentence. <span class="en">You.</span></li>'+
    '<li>You listen. You read. You tap Avanti. You never type.</li>'+
    '</ul>'+
    '<button type="button" class="teal" id="go">Andiamo!</button></div>';
  document.getElementById("go").onclick=function(){ i=0; show(false); };
}
function show(fromBack){
  var s=STOPS[i], dots="";
  for(var k=0;k<STOPS.length;k++) dots+='<i class="stop'+(k<i?" done":k===i?" now":"")+'" style="left:'+pct(k)+'"></i>';
  var existing=document.getElementById("bot");
  if(!existing){
    view.innerHTML='<div class="route" aria-hidden="true" id="route"></div><div class="card" id="card"></div>'+
      '<div class="dock"><button type="button" class="plain" id="back"></button><button type="button" class="teal" id="next"></button></div>';
    document.getElementById("route").innerHTML='<div class="bot" id="bot" style="left:'+pct(Math.max(i-1,0))+'"><img src="'+STOPS[i].pose+'" alt=""></div>';
    document.getElementById("back").onclick=function(){ if(i===0) start(); else { i--; show(true); } };
    document.getElementById("next").onclick=function(){ if(i===STOPS.length-1) start(); else { i++; show(false); } };
  }
  var route=document.getElementById("route"), bot=document.getElementById("bot");
  route.querySelectorAll(".stop").forEach(function(n){ n.remove(); });
  route.insertAdjacentHTML("afterbegin",dots);
  bot.querySelector("img").src=s.pose;
  requestAnimationFrame(function(){ bot.style.left=pct(i); });
  document.getElementById("card").innerHTML=
    '<img class="shot" src="'+s.img+'" alt="'+esc(s.alt)+'">'+
    '<p class="who" lang="it">'+s.who+' = <span lang="en">'+s.whoEn+'</span></p>'+
    '<p class="it" lang="it">'+s.it+'</p><p class="en" lang="en">'+s.en+'</p>';
  document.getElementById("back").textContent=i===0?"Inizio":"Indietro";
  document.getElementById("next").textContent=i===STOPS.length-1?"Ancora":"Avanti";
  say(s.say);
}
start();
</script>
</body>
</html>
