<style>
:root{--bg:#f6f1e6;--card:#fffaf2;--ink:#1c1915;--teal:#0f766e;--line:#e4d8c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.35;font-style:normal}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#shell{width:min(100%,560px);height:100dvh;margin:0 auto;display:flex;flex-direction:column;min-height:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{font-weight:900;font-size:1.15rem}
.controls{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--card);border:2px solid var(--ink);font-weight:900;font-size:1.15rem;display:grid;place-items:center}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);border-width:3px;background:#efe6d4}
#view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.progress{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.progress b{font-size:1rem;min-width:3.2rem}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--line);border:0}
.dots i.done,.dots i.now{background:var(--teal)}
.scene{position:relative;flex:1;min-height:140px;border-radius:28px;overflow:hidden;border:2px solid var(--ink);background:#cbbfae}
.scene .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.scene .ground{position:absolute;left:16%;right:16%;bottom:3%;height:22px;border-radius:50%;background:rgba(28,25,21,.35);filter:blur(5px);z-index:1}
.scene .boh,.boh-hit{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:94%;max-width:94%;z-index:2;filter:drop-shadow(0 12px 10px rgba(28,25,21,.28))}
.scene .boh{width:auto;pointer-events:none;object-fit:contain;object-position:center bottom}
.boh-hit{padding:0;background:none;border:0;width:max-content;cursor:pointer}
.boh-hit img{height:100%;width:auto;max-width:100%;display:block;pointer-events:none;object-fit:contain;object-position:center bottom}
.layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.bubble{flex:0 0 auto;position:relative;z-index:3;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px 12px 6px;text-align:center}
.bubble.speaking{border-color:var(--teal)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.speaking:after{border-color:transparent var(--teal) var(--teal) transparent}
.bubble .it{font-size:clamp(1.45rem,6vw,2.1rem)}
.cap{margin:2px 0 0;font-weight:800;font-size:1rem}
.panel{flex:0 0 auto;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px;text-align:center}
.who{margin:0 auto 4px;display:inline-block;padding:2px 14px;border:2px solid var(--teal);border-radius:99px;font-weight:900;font-size:1.05rem}
.it{margin:0;font-weight:900;font-size:clamp(1.7rem,7vw,2.45rem);line-height:1.15}
.en{display:none;margin:2px 0 0;color:var(--teal);font-weight:800;font-size:clamp(1.05rem,3.8vw,1.25rem)}
.bubble:hover .en,.bubble:focus-within .en,.city:hover .en,body.en .en{display:block}
@keyframes walk-in{
  0%{transform:translateX(calc(-50% - 78px)) translateY(0) rotate(-3deg)}
  35%{transform:translateX(calc(-50% - 40px)) translateY(-10px) rotate(2deg)}
  65%{transform:translateX(calc(-50% - 16px)) translateY(0) rotate(-2deg)}
  100%{transform:translateX(-50%) translateY(0) rotate(0)}
}
@keyframes step{
  0%,100%{transform:translateX(calc(-50% - 6px)) translateY(0) rotate(-2.5deg)}
  50%{transform:translateX(calc(-50% + 6px)) translateY(-10px) rotate(2.5deg)}
}
.boh-hit.arrive,.scene .boh.arrive{animation:walk-in 1.05s ease-out both}
.boh-hit.stepping,.scene .boh.stepping{animation:step .68s ease-in-out infinite}
.field{width:min(100%,24rem);display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:800;font-size:1rem}
.field input{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--card);padding:8px 12px;font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink)}
.need{margin:0;font-weight:800;color:var(--ink)}
.cities{width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.city{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px;text-align:left;min-height:88px}
.city img{width:92px;height:72px;object-fit:cover;border-radius:12px}
.city b{display:block;font-size:1.35rem}
.teacher-link{font-weight:800;color:var(--teal);font-size:1rem}
.result{margin:8px 0 0;font-weight:800;font-size:1.05rem;min-height:1.3em}
.result.bene{color:var(--teal)}
.result.quasi,.result.again{color:var(--ink)}
.result.saved{color:var(--teal);font-size:1.55rem}
.flash{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none}
.flash div{background:var(--card);border:3px solid var(--teal);border-radius:28px;padding:18px 32px 14px;text-align:center;box-shadow:0 10px 0 rgba(28,25,21,.16);animation:pop .28s ease-out both}
.flash b{display:block;font-size:3.2rem;font-weight:900;line-height:1;color:var(--teal)}
.flash small{display:block;margin-top:8px;font-weight:800;font-size:1.2rem;color:var(--ink)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.heard{font-weight:800}
.listen-tag{position:absolute;top:12px;left:12px;z-index:3;background:var(--card);border:2px solid var(--teal);border-radius:99px;padding:6px 12px;font-weight:900}
.dock{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 1.35fr;gap:8px}
.plain,.teal,.slim{min-height:58px;border-radius:18px;font-weight:900;font-size:1.2rem;border:2px solid var(--ink);background:var(--card);padding:8px 10px}
.plain.need-sound{border-color:var(--teal);border-width:3px;background:#efe6d4}
.teal{background:var(--teal);border-color:var(--teal);color:#fff;font-size:1.35rem}
.slim{min-height:48px;font-size:1.05rem}
.teal[disabled],.plain[disabled]{opacity:.55}
.start,.done{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 2px 4px}
.start{overflow:auto}
.start .scene{flex:0 0 auto;width:100%;height:min(30dvh,240px)}
.done .scene{flex:0 0 auto;width:100%;height:min(20dvh,170px)}
.done .book{flex:1;min-height:0;overflow:auto;width:min(100%,24rem)}
h1{margin:0;font-size:clamp(2rem,8vw,2.7rem);line-height:1.1;font-weight:900}
.lead{margin:0;font-weight:800;font-size:1.15rem;max-width:24rem}
.steps{margin:0;padding:0;list-style:none;width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.steps li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:1.08rem;text-align:left}
.book{margin:0;padding:0;list-style:none;width:min(100%,24rem);display:flex;flex-direction:column;gap:8px}
.book li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-weight:900;font-size:1.15rem}
.book small{display:block;color:var(--teal);font-weight:800;font-size:.95rem}
.start .teal,.done .teal{width:min(100%,320px);flex:0 0 auto}
body.big .it{font-size:clamp(2.05rem,8.4vw,2.9rem)}
body.big .en{font-size:1.35rem}
body.big .who{font-size:1.2rem}
@media (min-width:800px){
  #shell{width:min(100%,1120px)}
  .it{font-size:clamp(2rem,4vw,2.8rem)}
  .bubble .it{font-size:clamp(1.8rem,3vw,2.4rem)}
  .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,400px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"photo words" "photo check" "photo buttons";gap:12px;align-items:stretch}
  .bubble{grid-area:words}
  .bubble:after{display:none}
  .scene{grid-area:photo;min-height:0;height:100%}
  .panel{grid-area:check;align-self:end}
  .dock{grid-area:buttons}
  .scene .boh,.boh-hit{height:96%}
}
@media (max-height:700px){
  .start .scene,.done .scene{height:min(26dvh,180px)}
  .panel{padding:8px 10px}
  .plain,.teal{min-height:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

]},
{id:"torino",name:"Torino",en:"Turin",cover:"art/cities/torino-piazza-san-carlo.jpg",stops:[

{who:"io",whoEn:"I",it:"Io vedo il museo.",en:"I see the museum.",img:"art/cities/torino-museo-egizio.jpg",alt:"The Egyptian Museum in Turin, with statues by the door.",pose:"art/avatar/boh-point.png",say:"art/voice/torino-museo.mp3",keys:["vedo","museo"]},
{who:"tu",whoEn:"you",it:"Tu sei a Torino.",en:"You are in Turin.",img:"art/cities/torino-via-roma.jpg",alt:"Via Roma, a main street in Turin.",pose:"art/avatar/boh-wave.png",say:"art/voice/torino-tu.mp3",keys:["sei","torino"]},
{who:"io",whoEn:"I",it:"Io sono a Torino.",en:"I am in Turin.",img:"art/cities/torino-piazza-castello.jpg",alt:"Piazza Castello in Turin.",pose:"art/avatar/boh-walk.png",say:"art/voice/torino-sono.mp3",keys:["sono","torino"]}
]}
];
var view=document.getElementById("view"), muted=false, ci=-1, i=-1, voice=null, mine=null;
var phase="idle", heard="", mark="", takeUrl="", recog=null, rec=null, mic=null, timer=null, chunks=[], session=0, heardHer=false, arrive=false;
var studentName="", classCode="", sid="", conn=null, peer=null, linked=false, showEn=false;
var log={};
function list(){ return ci<0?[]:CITIES[ci].stops; }
function cur(){ return list()[i]; }
try{ log=JSON.parse(sessionStorage.getItem("auraLog")||"{}")||{}; }catch(e){ log={}; }
sid=sessionStorage.getItem("auraSid")||"";
if(!sid){ sid=Math.random().toString(36).slice(2,8); sessionStorage.setItem("auraSid", sid); }
showEn=sessionStorage.getItem("auraEn")==="1";

function fold(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
}
function judge(stop, alts){
  var best=0, said=alts[0]||"";
  alts.forEach(function(raw){
    var h=fold(raw), n=0;
    stop.keys.forEach(function(k){ if(h.indexOf(fold(k))>=0) n++; });
    var ratio=n/stop.keys.length;
    if(ratio>best){ best=ratio; said=raw; }
  });
  if(best>=0.99) return {mark:"bene", heard:said};
  if(best>=0.5) return {mark:"quasi", heard:said};
  return {mark:"again", heard:said};
}
var player=document.getElementById("bohVoice");
var mePlayer=document.getElementById("meVoice");
function say(src){
  if(!src) return;
  var cap=document.getElementById("cap");
  var hear=document.getElementById("hear");
  if(muted){
    if(cap) cap.textContent="Sound is off. Tap the speaker.";
    return;
  }
  try{ player.pause(); }catch(e){}
  if(player.getAttribute("data-src")!==src){
    player.src=src;
    player.setAttribute("data-src", src);
  }
  try{ player.currentTime=0; }catch(e){}
  voice=player;
  var run=player.play();
  if(run&&run.catch) run.catch(function(){
    if(cap&&cap.isConnected) cap.textContent="Tap Hear Boh to listen.";
    if(hear&&hear.isConnected){ hear.textContent="Tap to hear"; hear.classList.add("need-sound"); }
  });
}
function hush(){ if(player){ try{ player.pause(); }catch(e){} } voice=null; }
function hushMine(){ if(mine){ mine.pause(); mine=null; } }
function releaseMic(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(recog){ try{ recog.onresult=null; recog.onerror=null; recog.onend=null; recog.abort(); }catch(e){} recog=null; }
  if(rec){
    try{ rec.onstop=null; rec.ondataavailable=null; }catch(e){}
    if(rec.state==="recording"){ try{ rec.stop(); }catch(e2){} }
    rec=null;
  }
  if(mic){ mic.getTracks().forEach(function(t){ t.stop(); }); mic=null; }
}
function clearTake(){
  session++;
  releaseMic();
  hushMine();
  if(takeUrl){ URL.revokeObjectURL(takeUrl); takeUrl=""; }
  phase="idle"; heard=""; mark=""; chunks=[]; heardHer=false;
}
function poseNow(stop){
  if(arrive) return "art/avatar/boh-walk.png";
  if(phase==="listen") return "art/avatar/boh-please.png";
  if(mark==="bene"||mark==="saved") return "art/avatar/boh-ok.png";
  if(mark==="quasi"||mark==="again"||mark==="missed"||mark==="blocked") return "art/avatar/boh-huh.png";
  return stop.pose;
}
function motionClass(pose){
  if(arrive) return "arrive";
  if(phase!=="listen" && !mark && /boh-walk/.test(pose)) return "stepping";
  return "";
}
function saidCount(c){
  var rows=log[c.id]||[], n=0, k;
  for(k=0;k<c.stops.length;k++) if(rows[k] && rows[k].mark && rows[k].mark!=="started") n++;
  return n;
}
function remember(kind){
  if(ci<0||i<0) return;
  var c=CITIES[ci], s=c.stops[i];
  if(!log[c.id]) log[c.id]=[];
  log[c.id][i]={it:s.it, en:s.en, mark:kind||mark||"started", heard:heard||""};
  try{ sessionStorage.setItem("auraLog", JSON.stringify(log)); }catch(e){}
  sendTeacher();
}
function packLog(){
  try{ return "WALK1."+btoa(unescape(encodeURIComponent(JSON.stringify({name:studentName||"Student", stops:log})))); }
  catch(e){ return ""; }
}
function teacherId(code){ return "aurawalk-"+String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function sendTeacher(){
  if(!conn||!conn.open) return;
  try{ conn.send({type:"update", id:sid, name:studentName||"Student", stops:log}); }catch(e){}
}
function connectTeacher(){
  if(!window.Peer||!classCode||!studentName) return;
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=new Peer(teacherId(classCode)+"-s-"+sid, {debug:0});
  peer.on("open", function(){
    conn=peer.connect(teacherId(classCode));
    conn.on("open", function(){ linked=true; sendTeacher(); });
    conn.on("close", function(){ linked=false; });
  });
  peer.on("error", function(){ linked=false; });
}
function caption(){
  if(phase==="listen") return "Boh is listening.";
  if(mark==="bene") return "Boh says: Bene!";
  if(mark==="quasi") return "Boh says: Almost. Try the whole sentence.";
  if(mark==="again"||mark==="missed") return "Boh says: Try again.";
  if(mark==="saved") return "Boh heard you. Tap Hear me.";
  if(mark==="blocked") return "Allow the microphone, then try again.";
  if(heardHer) return "Now say it back.";
  return "Tap Boh.";
}
function hearBoh(){
  if(phase==="listen"||i<0) return;
  heardHer=true;
  mark=""; phase="idle";
  paint();
  var bub=document.getElementById("bubble");
  var cap=document.getElementById("cap");
  if(bub) bub.classList.add("speaking");
  if(cap) cap.textContent="Listen.";
  say(cur().say);
  if(voice) voice.onended=function(){
    if(bub) bub.classList.remove("speaking");
    if(cap) cap.textContent="Now say it back.";
  };
}
document.getElementById("muteBtn").onclick=function(){
  muted=!muted; this.setAttribute("aria-pressed",muted); this.textContent=muted?"🔇":"🔊";
  this.setAttribute("aria-label",muted?"Unmute":"Mute"); if(muted){ hush(); hushMine(); }
};
document.getElementById("bigBtn").onclick=function(){
  this.setAttribute("aria-pressed",document.body.classList.toggle("big"));
};
function applyEn(){
  document.body.classList.toggle("en", showEn);
  var b=document.getElementById("engBtn");
  if(!b) return;
  b.setAttribute("aria-pressed", showEn?"true":"false");
  b.setAttribute("aria-label", showEn?"Hide English":"Show English");
}
document.getElementById("engBtn").onclick=function(){
  showEn=!showEn;
  try{ sessionStorage.setItem("auraEn", showEn?"1":"0"); }catch(e){}
  applyEn();
};
applyEn();
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function sceneHtml(img, alt, pose, tappable, motion, flash){
  var cls=motion||"";
  var fig=tappable
    ? '<button type="button" class="boh-hit '+cls+'" id="bohBtn" aria-label="Hear Boh"><img src="'+pose+'" alt=""></button>'
    : '<img class="boh '+cls+'" src="'+pose+'" alt="">';
  return '<div class="scene"><img class="shot" src="'+img+'" alt="'+esc(alt)+'">'+
    '<div class="ground"></div>'+fig+(flash||'')+'</div>';
}
function armWalk(el){
  if(!el) return;
  el.addEventListener("animationend", function(ev){
    if(ev.animationName!=="walk-in"||!arrive||!el.isConnected) return;
    arrive=false;
    var pose=poseNow(cur());
    var img=el.querySelector("img")||el;
    img.src=pose;
    el.classList.remove("arrive");
    if(motionClass(pose)==="stepping") el.classList.add("stepping");
  });
}
function resultHtml(){
  if(phase==="listen") return '<p class="result" aria-live="polite">Say the sentence now.</p>';
  if(mark==="bene") return '<p class="result bene" aria-live="polite">Bene! I heard “'+esc(heard)+'”.</p>';
  if(mark==="quasi") return '<p class="result quasi" aria-live="polite">Almost. I heard “'+esc(heard)+'”. Try the whole sentence.</p>';
  if(mark==="again") return '<p class="result again" aria-live="polite">I heard “'+esc(heard||"…")+ '”. Listen to Boh, then say it again.</p>';
  if(mark==="saved") return '<p class="result saved" aria-live="polite">Saved. Tap Hear me.</p>';
  if(mark==="missed") return '<p class="result again" aria-live="polite">I didn’t hear you. Tap Say it again.</p>';
  if(mark==="blocked") return '<p class="result again" aria-live="polite">The mic is off. Allow the microphone, then tap Say it.</p>';
  return '<p class="result" aria-live="polite"></p>';
}
function enterCities(){
  studentName=(document.getElementById("name").value||"").trim();
  classCode=(document.getElementById("code").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(classCode && !studentName){ document.getElementById("need").hidden=false; return; }
  try{
    sessionStorage.setItem("auraName", studentName);
    sessionStorage.setItem("auraCode", classCode);
  }catch(e){}
  if(classCode && studentName) connectTeacher();
  cities();
}
function start(){
  clearTake(); hush(); ci=-1; i=-1;
  var savedName="", savedCode="";
  try{
    savedName=sessionStorage.getItem("auraName")||"";
    savedCode=(new URLSearchParams(location.search).get("code")||sessionStorage.getItem("auraCode")||"").toUpperCase();
  }catch(e){}
  view.innerHTML=
    '<div class="start">'+
    sceneHtml("art/cities/roma-colosseo.jpg","The Colosseum in Rome.","art/avatar/boh-walk.png",true,"stepping")+
    '<h1>Da Boh a Lo So!</h1>'+
    '<p class="lead">Boh walks through five cities. You say each sentence. Tap En, or rest on the words, to see English.</p>'+
    '<label class="field">First name<input id="name" autocomplete="given-name" maxlength="24" value="'+esc(savedName)+'"></label>'+
    '<label class="field">Class code<input id="code" maxlength="6" autocapitalize="characters" value="'+esc(savedCode)+'" placeholder="From your teacher"></label>'+
    '<p class="need" id="need" hidden>Type your first name so your teacher can see you.</p>'+
    '<button type="button" class="teal" id="go">Pick a city</button>'+
    '<a class="teacher-link" href="teacher.html">Teacher page</a></div>';
  document.getElementById("go").onclick=enterCities;
  var hello=document.getElementById("bohBtn");
  if(hello) hello.onclick=enterCities;
}
function cities(){
  clearTake(); hush(); ci=-1; i=-1;
  var cards="", n, c, got;
  for(n=0;n<CITIES.length;n++){
    c=CITIES[n]; got=saidCount(c);
    cards+='<button type="button" class="city" data-n="'+n+'"><img src="'+c.cover+'" alt="">'+
      '<span><b lang="it">'+c.name+'</b><span class="en">'+esc(c.en)+'</span>'+
      '<span class="cap">'+(got?got+"/"+c.stops.length+" said":"Walk here")+'</span></span></button>';
  }
  view.innerHTML='<div class="start"><h1>Pick a city</h1><p class="lead">Each city uses different words.</p><div class="cities">'+cards+'</div></div>';
  view.querySelectorAll(".city").forEach(function(btn){
    btn.onclick=function(){ ci=+btn.getAttribute("data-n"); i=0; show(); };
  });
}
function done(){
  clearTake(); hush();
  var c=CITIES[ci], lines="", k, row;
  for(k=0;k<c.stops.length;k++){
    row=(log[c.id]||[])[k];
    lines+='<li lang="it">'+esc(c.stops[k].it)+'<small class="en">'+esc(c.stops[k].en)+(row&&row.mark&&row.mark!=="started"?" · "+row.mark:"")+'</small></li>';
  }
  var note=linked?"Your teacher can see this.":(classCode?"The teacher page did not connect. Copy this and paste it on the teacher page.":"Next time, use a class code from the teacher page.");
  view.innerHTML=
    '<div class="done">'+
    sceneHtml(c.cover,c.name,"art/avatar/boh-walk.png",false,"stepping")+
    '<h1 lang="it">'+esc(c.name)+'</h1>'+
    '<p class="lead">'+esc(note)+' Write one of these sentences in the town book.</p>'+
    '<ul class="book">'+lines+'</ul>'+
    (linked?"":'<button type="button" class="plain" id="copy">Copy for teacher</button>')+
    '<button type="button" class="teal" id="again">All cities</button></div>';
  var copy=document.getElementById("copy");
  if(copy) copy.onclick=function(){
    var text=packLog();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function(){});
    copy.textContent="Copied";
  };
  document.getElementById("again").onclick=cities;
}
function show(){
  clearTake();
  arrive=true;
  paint();
  remember("started");
  var bub=document.getElementById("bubble");
  var cap=document.getElementById("cap");
  if(bub) bub.classList.add("speaking");
  if(cap) cap.textContent="Listen.";
  say(cur().say);
  if(voice) voice.onended=function(){
    if(bub&&bub.isConnected) bub.classList.remove("speaking");
    heardHer=true;
    if(cap&&cap.isConnected) cap.textContent="Now say it back.";
  };
}
function paint(){
  var s=cur(), dots="", k, pose=poseNow(s);
  for(k=0;k<list().length;k++) dots+='<i class="'+(k<i?"done":k===i?"now":"")+'"></i>';
  var sayLabel=phase==="listen"?"Stop":(mark==="quasi"||mark==="again"||mark==="missed"?"Say it again":"Say it");
  view.innerHTML=
    '<div class="progress" aria-label="Stop '+(i+1)+' of '+list().length+'"><b>'+(i+1)+' / '+list().length+'</b><div class="dots" aria-hidden="true">'+dots+'</div></div>'+
    '<div class="layout">'+
    '<div class="bubble'+(phase==="listen"?" speaking":"")+'" id="bubble">'+
    '<p class="it" lang="it">'+s.it+'</p><p class="en" lang="en">'+esc(s.en)+'</p><p class="cap" id="cap">'+esc(caption())+'</p></div>'+
    sceneHtml(s.img,s.alt,pose,true,motionClass(pose), mark==="saved"?'<div class="flash" role="status"><div><b>Saved</b><small>Tap Hear me</small></div></div>':'')+
    '<div class="panel">'+
    '<p class="who" lang="it">'+s.who+' = <span lang="en">'+s.whoEn+'</span></p>'+
    resultHtml()+
    '</div>'+
    '<div class="dock">'+
    (takeUrl&&phase!=="listen"?'<button type="button" class="slim" id="playMe">Hear me</button>':"")+
    '<div class="row">'+
    '<button type="button" class="plain" id="hear">Hear Boh</button>'+
    '<button type="button" class="teal" id="sayBtn">'+sayLabel+'</button>'+
    '</div>'+
    '<div class="row">'+
    '<button type="button" class="plain" id="back">'+(i===0?"Cities":"Back")+'</button>'+
    '<button type="button" class="plain" id="next">'+(i===list().length-1?"Finish":"Next place")+'</button>'+
    '</div></div></div>';
  armWalk(document.getElementById("bohBtn"));
  document.getElementById("bohBtn").onclick=hearBoh;
  document.getElementById("hear").onclick=hearBoh;
  document.getElementById("sayBtn").onclick=function(){ if(phase==="listen") stopListen(); else beginListen(); };
  document.getElementById("back").onclick=function(){ if(i===0) cities(); else { i--; show(); } };
  document.getElementById("next").onclick=function(){ if(i===list().length-1) done(); else { i++; show(); } };
  var playMe=document.getElementById("playMe");
  if(playMe) playMe.onclick=function(){
    if(!takeUrl||muted) return;
    hush(); hushMine();
    mePlayer.src=takeUrl;
    mine=mePlayer;
    var run=mePlayer.play();
    if(run&&run.catch) run.catch(function(){ playMe.textContent="Tap again to hear"; });
  };
}
function beginListen(){
  arrive=false;
  hush(); hushMine();
  var my=++session;
  var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(!SpeechRec){ mark="blocked"; phase="idle"; paint(); return; }
  }
  phase="listen"; heard=""; mark=""; paint();
  function armTimer(){ if(timer) clearTimeout(timer); timer=setTimeout(stopListen, 5000); }
  function closeListen(){
    if(my!==session) return;
    if(mic){ mic.getTracks().forEach(function(t){ t.stop(); }); mic=null; }
    if(phase!=="listen"){ paint(); return; }
    phase="done";
    if(!mark) mark=(window.SpeechRecognition||window.webkitSpeechRecognition)?"missed":"saved";
    paint();
    remember();
  }
  if(SpeechRec){
    recog=new SpeechRec();
    recog.lang="it-IT";
    recog.interimResults=false;
    recog.maxAlternatives=5;
    recog.continuous=false;
    recog.onresult=function(ev){
      var alts=[], j, res=ev.results[ev.results.length-1];
      for(j=0;j<res.length;j++) alts.push(res[j].transcript);
      var judged=judge(cur(), alts);
      mark=judged.mark; heard=judged.heard;
      stopListen();
    };
    recog.onerror=function(ev){
      if(my!==session) return;
      if(ev.error==="no-speech"){ if(!mark) mark="missed"; }
      else if(!mark) mark="saved";
      setTimeout(function(){
        if(my!==session||phase!=="listen") return;
        if(rec&&rec.state==="recording") return;
        stopListen();
      }, 500);
    };
    try{ recog.start(); }catch(err){ mark="saved"; }
  }
  var startRec=function(stream){
    if(my!==session||phase!=="listen"){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    mic=stream;
    chunks=[];
    var mime="";
    if(window.MediaRecorder){
      if(MediaRecorder.isTypeSupported("audio/webm")) mime="audio/webm";
      else if(MediaRecorder.isTypeSupported("audio/mp4")) mime="audio/mp4";
    }
    try{
      rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    }catch(err){ rec=null; }
    if(!rec){ if(!SpeechRec){ mark="blocked"; phase="done"; paint(); } else armTimer(); return; }
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      if(chunks.length){
        if(takeUrl) URL.revokeObjectURL(takeUrl);
        takeUrl=URL.createObjectURL(new Blob(chunks,{type:chunks[0].type||mime||"audio/webm"}));
      }
      setTimeout(closeListen, 600);
    };
    rec.start();
    armTimer();
  };
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(startRec).catch(function(){
      if(my!==session) return;
      if(!SpeechRec){ mark="blocked"; phase="done"; paint(); return; }
      if(!mark) mark="";
      if(phase==="listen") armTimer();
    });
  }else armTimer();
}
function stopListen(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(recog){ try{ recog.stop(); }catch(e){} }
  if(rec&&rec.state==="recording"){ try{ rec.stop(); }catch(e){} return; }
  if(mic){ mic.getTracks().forEach(function(t){ t.stop(); }); mic=null; }
  if(phase==="listen"){
    phase="done";
    if(!mark) mark="missed";
    paint();
    remember();
  }
}
start();
</script>
